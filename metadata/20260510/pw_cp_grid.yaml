run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
ins_index: [0]  # smoke: single 50-job/5-stage instance
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260510

instance_worker_cnt: 1

draw_gantt: false
painter_thread_cnt: 4

scenarios:
  - name: pw_cp_u2_pf0
    timelimit: "0.05nc"
    output_subdir: pw_cp_u2_pf0
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        adjust_p: true
        adjust_r: true
      - method: pw_cp
        solver_thread_cnt: 4
        batch_size: 1
        unfixed_batch_count: 2
        left_profile_fixed_batch_count: 1
        right_profile_fixed_batch_count: 1
        pf_method: "PF0"
        total_timelimit: "0.04nc"
        batch_tl_mode: "constant"
        draw_gantt: false

  - name: pw_cp_u2_pf1
    timelimit: "0.05nc"
    output_subdir: pw_cp_u2_pf1
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        adjust_p: true
        adjust_r: true
      - method: pw_cp
        solver_thread_cnt: 4
        batch_size: 1
        unfixed_batch_count: 2
        left_profile_fixed_batch_count: 1
        right_profile_fixed_batch_count: 1
        pf_method: "PF1"
        total_timelimit: "0.04nc"
        batch_tl_mode: "constant"
        draw_gantt: false

  - name: pw_cp_u3_pf0
    timelimit: "0.05nc"
    output_subdir: pw_cp_u3_pf0
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        adjust_p: true
        adjust_r: true
      - method: pw_cp
        solver_thread_cnt: 4
        batch_size: 1
        unfixed_batch_count: 3
        left_profile_fixed_batch_count: 1
        right_profile_fixed_batch_count: 1
        pf_method: "PF0"
        total_timelimit: "0.04nc"
        batch_tl_mode: "constant"
        draw_gantt: false

  - name: pw_cp_u3_pf1
    timelimit: "0.05nc"
    output_subdir: pw_cp_u3_pf1
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        adjust_p: true
        adjust_r: true
      - method: pw_cp
        solver_thread_cnt: 4
        batch_size: 1
        unfixed_batch_count: 3
        left_profile_fixed_batch_count: 1
        right_profile_fixed_batch_count: 1
        pf_method: "PF1"
        total_timelimit: "0.04nc"
        batch_tl_mode: "constant"
        draw_gantt: false
