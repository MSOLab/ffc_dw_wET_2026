run_mode: FULL_RUN

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
ins_index: [0]  # single small instance for hint inspection
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260510

instance_worker_cnt: 1

draw_gantt: false
painter_thread_cnt: 1

scenarios:
  - name: pw_cp_hint_check
    timelimit: "0.05nc"
    output_subdir: pw_cp_hint_check
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        adjust_p: true
        adjust_r: true
      - method: pw_cp
        # single thread + per-step TL big enough for solver to print hint info
        solver_thread_cnt: 1
        batch_size: 1
        unfixed_batch_count: 3
        left_profile_fixed_batch_count: 1
        right_profile_fixed_batch_count: 1
        pf_method: "PF1"
        cp_tl: 1.0
        batch_tl_mode: "constant"
        # capture log only for the first step — inspecting one fully-loaded
        # CP-SAT search is enough to confirm hints loaded correctly.
        log_search_progress: true
        log_search_progress_max_steps: 1
