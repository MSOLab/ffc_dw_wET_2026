run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
ins_index: [0]  # smoke: single 50-job/5-stage instance
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260510

instance_worker_cnt: 1

draw_gantt: false
painter_thread_cnt: 4

scenarios:
  - name: incremental_sw_cp_always
    timelimit: "0.1nc"
    output_subdir: incremental_sw_cp_always
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        adjust_p: true
        adjust_r: true
      - method: incremental_sw_cp
        solver_thread_cnt: 4
        batch_size: 1
        step_size: 1
        unfixed_batch_count_min: 1
        unfixed_batch_count_max: 4
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 1
        right_profile_fixed_batch_count: 1
        pf_method: "PF1"
        total_timelimit: "0.02nc"
        batch_tl_mode: "constant"

  - name: incremental_sw_cp_if_no_improvement
    timelimit: "0.1nc"
    output_subdir: incremental_sw_cp_if_no_improvement
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        adjust_p: true
        adjust_r: true
      - method: incremental_sw_cp
        solver_thread_cnt: 4
        batch_size: 1
        step_size: 1
        unfixed_batch_count_min: 1
        unfixed_batch_count_max: 4
        increment_unfixed_batch_count_flag: "if_no_improvement"
        left_profile_fixed_batch_count: 1
        right_profile_fixed_batch_count: 1
        pf_method: "PF1"
        total_timelimit: "0.02nc"
        batch_tl_mode: "constant"
