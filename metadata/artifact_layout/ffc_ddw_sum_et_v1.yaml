schema_version: 1
overlay_for: routix.io._default_artifact_layout

# Project-specific artifact kinds for ffc_ddw_sum_et. Layered on top of
# routix's default schema by FFcArtifactLayout which calls register_kind for
# each entry.
#
# Zone rule (matches routix base, fail-fast):
#   - scope=instance: zone REQUIRED, one of {final, progress, report}.
#   - scope=run / scenario: zone FORBIDDEN.

artifacts:
  # ---- instance / final ----
  # Compact JSON variant of routix's default `obj_log` (yaml). Same logical
  # contents (per-step trajectory of obj_value / obj_bound), single-line
  # serialization to keep file size small. The default `obj_log` (yaml) kind
  # is left registered by routix but unused by this project.
  - scope: instance
    zone: final
    kind: obj_log_json
    file_template: "{instance_name}_obj_log.json"

  # ---- instance / progress (per-instance solve trajectory) ----
  - scope: instance
    zone: progress
    kind: mcf_lb_diagnostic
    file_template: "{instance_name}_mcf_lb_diagnostic.yaml"
  # MCF LB intermediate schedules. Compact JSON, two shapes share the kind:
  # FFcSchedule -> dump_solution_json (operations[]); MCFPreemptiveSchedule
  # -> dump_preemptive_schedule_json (segments[]). `phase_name` already
  # carries the controller call_context prefix
  # (e.g. "1-calc_mcf_lb_and_derive_full_sch_1_mcf_preemptive_sch") so files
  # sort by subroutine-flow step on disk and don't collide across steps.
  - scope: instance
    zone: progress
    kind: mcf_lb_phase_schedule
    file_template: "{phase_name}.json"
  # Compact-JSON phase snapshots from FlipMakespanCpDispatcher. Same shape as
  # `solution_json` (operations[]), so the reporter reuses
  # `_render_gantt_from_solution_json` to produce a `phase_gantt_png` per file.
  # `phase_name` carries the controller call_context prefix.
  - scope: instance
    zone: progress
    kind: flip_makespan_cp_phase_schedule
    file_template: "{phase_name}.json"

  # ---- instance / report (post-run renderings) ----
  # `phase_gantt_png` covers both regular and preemptive phase Gantt PNGs;
  # the renderer is picked from the source content shape (operations[] vs
  # segments[]), so a single kind suffices.
  # Filenames omit instance_name (the per-instance folder already identifies
  # it); the instance name is rendered into the chart title instead.
  - scope: instance
    zone: report
    kind: gantt_png
    file_template: "solution_gantt.png"
  - scope: instance
    zone: report
    kind: phase_gantt_png
    file_template: "{phase_name}_gantt.png"

  # ---- scenario ----
  - scope: scenario
    kind: scenario_statistics
    file_template: "{scenario_name}_statistics.yaml"
  - scope: scenario
    kind: mcf_lb_analysis
    file_template: "{scenario_name}_mcf_lb_analysis.csv"
  # Per-scenario interactive RPDf vs Time% chart, fed by per-instance
  # obj_log_json + manifest. Used by report/rpdf_scatter_chart.
  - scope: scenario
    kind: subroutine_rpdf_scatter_html
    file_template: "summary_method_rpdf_and_norm_time_scatter.html"

  # ---- run ----
  - scope: run
    kind: report_xlsx
    file_template: "{run_id}_report.xlsx"
  - scope: run
    kind: mcf_lb_dashboard
    file_template: "{run_id}_mcf_lb_dashboard.html"
  - scope: run
    kind: mcf_preemptive_obj_csv
    file_template: "{run_id}_mcf_preemptive_obj.csv"
  - scope: run
    kind: adjust_params_by_makespan_delta_csv
    file_template: "{run_id}_adjust_params_by_makespan_delta.csv"
  - scope: run
    kind: last_stage_only_obj_csv
    file_template: "{run_id}_last_stage_only_obj.csv"
  - scope: run
    kind: mcf_lb_lastStageOnlyObj_summary
    file_template: "{run_id}_mcf_lb_last_stage_only_obj.csv"
  - scope: run
    kind: mcf_lb_lastStageOnlyObj_count
    file_template: "{run_id}_mcf_lb_last_stage_only_obj_count.csv"
  - scope: run
    kind: mcf_lb_lastStageOnlyObj_BKS_wintie_pivot
    file_template: "{run_id}_mcf_lb_lastStageOnlyObj_BKS_wintie_pivot.html"
  - scope: run
    kind: mcf_lb_lastStageOnlyObj_BKS_wintie_table
    file_template: "{run_id}_mcf_lb_lastStageOnlyObj_BKS_wintie_table.html"
  - scope: run
    kind: rpdf_comparison_csv
    file_template: "{run_id}_rpdf_comparison.csv"
  - scope: run
    kind: rpdf_dashboard
    file_template: "{run_id}_rpdf_dashboard.html"
  - scope: run
    kind: win_tie_dashboard
    file_template: "{run_id}_win_tie_dashboard.html"
  - scope: run
    kind: time_p_dashboard
    file_template: "{run_id}_time_p_dashboard.html"
  # Run-level multi-scenario subroutine flow comparison chart. Aggregates
  # endpoint/progression frames built from each scenario's obj_log_jsons.
  - scope: run
    kind: multi_scenario_subroutine_flow_comparison_html
    file_template: "{run_id}_multi_scenario_subroutine_flow_comparison.html"
