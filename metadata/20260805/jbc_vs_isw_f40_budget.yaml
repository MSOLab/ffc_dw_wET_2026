        pf_method: "PF1"
        seq_tiebreak: "completion"
        seq_end_stage: -2
      - method: job_batch_cp_midpoint_seq
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        batch_size: 40
        batch_tl_mode: "proportional"
        destroyed_op_tl_multiplier: 0.010
        pf_method: "PF1"
        seq_tiebreak: "completion"
        seq_end_stage: -2
      - method: job_batch_cp_midpoint_seq
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        batch_size: 45
        batch_tl_mode: "proportional"
        destroyed_op_tl_multiplier: 0.010
        pf_method: "PF1"
        seq_tiebreak: "completion"
        seq_end_stage: -2
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

  # ── job_batch_cp tail, kappa 0.005: same batch sizes, sweep run TWICE ───────
  - name: dv4_mcf_fmm_neh_jbc_k0005
