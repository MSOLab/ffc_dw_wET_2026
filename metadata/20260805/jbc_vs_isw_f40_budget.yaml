run_mode: FULL_RUN

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

# Same 160-instance (T, R) = (0.6, 0.2) slice as
# metadata/20260805/job_batch_cp_vs_isw_cp.yaml, so every arm pools with that
# run, with 20260728_dispatch_v4_init_tl and with 20260801_neh_cp_budget_allocation.
ins_filter:
  T: 0.6
  R: 0.2

output_dir: output/20260805_jbc_vs_isw_f40_budget

instance_worker_cnt: 12
draw_gantt: false
draw_progress_plot: true
painter_thread_cnt: 96

# The two tail arms of metadata/20260805/job_batch_cp_vs_isw_cp.yaml with their
# TIME BUDGET ONLY replaced by `dv4_c5init_f40`'s from
# metadata/20260728/dispatch_v4_init_tl.yaml:
#
#   timelimit                                   0.03nc  -> 0.09nc
#   run_flip_makespan_cp_from_incumbent.cp_tl   0.0012nc -> 0.0036nc
#   neh_cp_completion_seq.total_timelimit       0.0036nc -> 0.0108nc
#
# Nothing else is touched. The NEH order stays `neh_cp_completion_seq` (f40 runs
# `neh_cp` on the job_priority rule) because the instruction was the budget only,
# and the ISW-CP / job_batch_cp tail blocks are carried over verbatim.
#
# WHAT THIS BUYS: Q1 BECOMES A WITHIN-RUN PAIRED CONTRAST
#
# After the swap the two flows are BYTE-IDENTICAL to arms that already exist,
# verified by comparing the parsed `subroutine_flow` lists:
#
#   isw arm == output/20260801_neh_cp_budget_allocation/20260801T183302_770739
#              /dv4_mcf_fmm_comp_x1_base          (borrowed as isw_t090)
#   jbc arm == output/20260805_job_batch_cp_vs_isw_cp/20260805T104621_844665
#              /dv4_mcf_fmm_neh_jbc_t090
#
# So this run re-executes BOTH sides of Q1 together. That removes the one real
# limitation of plans/analysis/20260805/job_batch_cp_vs_isw_cp.md: Q1 there was
# a CROSS-RUN contrast (jbc from the 20260805 run, isw borrowed from 20260801).
# The noise yardstick measured 0.045 pp and the gap was 4.08 pp, so the sign was
# never in doubt -- but the paired version needs no yardstick at all.
#
# It also yields two TRUE replicates (same config, different run), unlike the
# `_jp` arm which differs in the NEH order:
#
#   isw_t090_r2 - isw_t090   pure cross-run noise on ISW-CP
#   jbc_t090_r2 - jbc_t090   pure cross-run noise on job_batch_cp
#
# Either of those is a cleaner noise estimate than the 0.045 pp currently
# quoted, and they say whether the 8-worker CP-SAT nondeterminism noted in
# 20260804_job_batch_cp_compare behaves the same for both refiners.
#
# PRIOR: both arms should land on their earlier observations --
# isw ~0.1460, jbc ~0.1868, gap ~4.08 pp in favour of ISW-CP. A gap that moves
# materially would mean the 20260805 run's Q1 was contaminated by something
# other than the algorithms, and the analysis document's conclusion 1 would need
# revisiting.
#
# WHY THE JBC ARM'S kappa IS 0.010 WHILE ISW-CP'S IS 0.005
#
# They multiply different counts, so the numbers are not comparable as written.
# `sw_cp` time-fixes everything outside its window and profile-fixed bands, so
# `non_time_fixed_op_count` is a strict subset of the model. `job_contrib_cp`,
# which `job_batch_cp` drives per batch, time-fixes NOTHING -- its non-time-fixed
# count is always the full n*c -- so the only quantity tracking the
# neighbourhood is the destroy set, |batch| * c.
#
# Measured on Instance_100_10_3_0,6_0,2_10_Rep0 (n*c = 1000):
#   ISW-CP window : ntf 172.7 -> TL 0.864 s     JBC batch B=15: 150 -> TL 1.50 s
#   per free-in-TIME op : ISW 0.0050 s vs JBC 0.0015 s   (JBC 3.3x LESS)
#   per free-in-ORDER op: ISW 0.0056-0.0077 s vs JBC 0.0100 s
#
# 0.010 was calibrated, not copied: a pass costs kappa*n*c regardless of
# batch_size, so 0.010 puts 7.3 passes in the ~0.0733nc tail and 8 are
# provisioned as a deliberate over-fill. Full derivation in
# metadata/20260805/job_batch_cp_vs_isw_cp.yaml.
#
# THIRD ARM: IS 0.010 THE WRONG END OF THE TRADE? ("shallow and many" vs
#            "deep and few")
#
# Because a pass costs kappa*n*c, kappa does NOT change how much total CP time
# the sweep gets. It only trades TL PER SOLVE against NUMBER OF PASSES over the
# same tail:
#
#   kappa 0.010 -> ~0.0103nc per pass ->  7.3 passes fit the ~0.0733nc tail
#   kappa 0.005 -> ~0.0052nc per pass -> 14.2 passes fit the same tail
#
# `dv4_mcf_fmm_neh_jbc_k0005` runs the SAME EIGHT batch sizes a second time
# rather than subdividing the range, so the batch-size SET is identical to the
# other JBC arm and only per-solve depth and pass count move. A repeated cycle
# is not a no-op: every pass re-derives the midpoint job order from the improved
# incumbent, so cycle 2 at batch_size 15 sweeps a different partition than cycle
# 1 did. 16 x ~0.0052nc = 0.0824nc over-fills the tail by the same margin the
# 8-pass arm uses, so `solve_base_model_cpsat` stays unreachable in all three
# arms and everything is compared at equal ELAPSED time.
#
# Putting it here rather than in its own config is what makes
# `dv4_mcf_fmm_neh_jbc_t090_r2` do double duty: it is the ISW-CP contrast's
# partner AND the kappa contrast's control, both within-run and paired, with no
# separate control arm to pay for.
#
#   isw_t090_r2 vs jbc_t090_r2   Q1, within-run paired
#   jbc_t090_r2 vs jbc_k0005     kappa, within-run paired (only kappa differs)
#
# PRIOR for the kappa contrast: kappa is an unlikely explanation for the 4.08 pp
# loss, because jbc_t090 (84.4 s) already lost to isw_t030 (28.2 s) by 1.13 pp
# -- 3x the effective time did not close it, and kappa cannot buy more total
# time than that. Expect k0005 ~= jbc_t090_r2 inside the noise band. A clear
# k0005 win would mean the neighbourhood is fine and the schedule of solver
# effort was wrong, reopening conclusion 1 of the analysis document; a clear
# loss would mean 0.010 was, if anything, too small.
#
# Budget: mean cap 84.4 s on this slice, ~19 min per scenario at 12 workers
# => ~57 min total for the three arms, plus reporting. 96 cores assumed idle
# (12 x 8 solver threads).
#
# MERGING: the replicate labels carry an `_r2` suffix and `k0005` is new, so all
# three stay unique against the existing 5-arm merge (build_merged_run_dir.py
# rejects duplicate labels). Both borrowed arms in that merge still own 1440
# instances, so `--intersect-instances` remains required.
scenarios:
  # ── ISW-CP tail at f40's budget (== 20260801 dv4_mcf_fmm_comp_x1_base) ──────
  - name: dv4_mcf_fmm_neh_isw_t090_r2
    timelimit: "0.09nc"
    output_subdir: jbc_vs_isw_f40_budget/dv4_mcf_fmm_neh_isw_t090_r2
    subroutine_flow:
      - method: initialize_by_dispatch_v4
        reconstruct_mode: "active_but_last_semi"
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.0036nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp_completion_seq
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.0108nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 8
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        batch_tl_mode: "proportional"
        non_time_fixed_op_time_limit_multiplier: 0.005
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

  # ── job_batch_cp tail at f40's budget (== 20260805 dv4_mcf_fmm_neh_jbc_t090) ─
  - name: dv4_mcf_fmm_neh_jbc_t090_r2
    timelimit: "0.09nc"
    output_subdir: jbc_vs_isw_f40_budget/dv4_mcf_fmm_neh_jbc_t090_r2
    subroutine_flow:
      - method: initialize_by_dispatch_v4
        reconstruct_mode: "active_but_last_semi"
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.0036nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp_completion_seq
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.0108nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      # 8 passes, batch_size 15 -> 50 by 5, over-filling the ~0.0733nc tail.
      # Unchanged from the source config; the earlier run reached 7.56 passes
