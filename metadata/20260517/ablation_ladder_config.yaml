# Ablation ladder for the FFcDDW (wET) thesis chapter.
#
# Five cumulative configurations C1..C5 quantify the marginal contribution
# of each algorithm component. See plans/20260517/ablation_ladder_plan.md.
#
# All scenarios share the same wall-clock budget ("0.09nc"). Per-step inner
# time limits are identical to mcf_lb_neh_cp_ipwcp_base_cpsat_3_config.yaml;
# when a step is omitted, its budget flows to the final base-CP solve.
#
# C5 reproduces output/20260512/20260512T105405_551753.

run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
# ins_index: [0, 10, 20, 30, 40, 50, 60, 70, 80]  # uncomment for smoke test
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260517

instance_worker_cnt: 12

draw_gantt: false
painter_thread_cnt: 16

scenarios:
  # ---- C1: base CP-SAT only -------------------------------------------
  - name: c1_base_cpsat
    timelimit: "0.09nc"
    output_subdir: c1_base_cpsat
    subroutine_flow:
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

  # ---- C2: + MCF-LB & full-schedule derivation ------------------------
  - name: c2_mcf_lb
    timelimit: "0.09nc"
    output_subdir: c2_mcf_lb
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

  # ---- C3: + flip-makespan CP -----------------------------------------
  - name: c3_flip_makespan_cp
    timelimit: "0.09nc"
    output_subdir: c3_flip_makespan_cp
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.009nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

  # ---- C4: + NEH-CP ---------------------------------------------------
  - name: c4_neh_cp
    timelimit: "0.09nc"
    output_subdir: c4_neh_cp
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.009nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.027nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

  # ---- C5: + incremental PW-CP (ISW-CP) = full IGC --------------------
  - name: c5_isw_cp
    timelimit: "0.09nc"
    output_subdir: c5_isw_cp
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.009nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.027nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: incremental_pw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 6
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        total_timelimit: "0.018nc"
        batch_tl_mode: "constant"
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8
