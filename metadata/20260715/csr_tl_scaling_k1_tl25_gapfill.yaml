run_mode: FULL_RUN

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260714_csr_tl_scaling_sweep

instance_worker_cnt: 12
draw_gantt: false
draw_progress_plot: false
painter_thread_cnt: 1

# Uncomment for smoke with 2 instances only (0000, 0001; n=50, c=5).
# ins_index: [0, 1]

# CSR TL-scaling sweep — K=1 × f=25% gap-fill run
# 계획: plans/20260714/csr_tl_scaling_sweep.md / TODO.md
#   "CSR TL-scaling sweep — fill the K=1 × f=25% gap cell"
#
# 선행 스윕(20260714T234921_531156)은 f=25% 열을 fixed-budget 선행 run
# (csr_full_grid_k248)으로 재사용했으나 그 run 은 K∈{2,4,8}만 커버 → K=1 에
# 25% 점이 없어 곡선이 5점(5/10/15/20/30)뿐이다. 이 run 은 그 한 칸만 채운다.
#
# 두 시나리오만: csr_full_d2wp_k1_tl25 / csr_neh_d2wp_k1_tl25.
#   factor 1(원해상도), f=25% ⇒ s=f/0.25=1.0 → 스케일 표의 base 행:
#     CSR timelimit 0.0225nc / flip cp_tl 0.00225nc /
#     neh total_timelimit 0.00675nc / sw_cp kappa 0.00125.
# 나머지 solver 설정은 선행 config 와 동일. 범위 = full 1440-grid × 2 = 2,880 run.
scenarios:
  # ────────────────────────────────────────────────────────────────────
  # csr_full_d2wp: mcf→flip→neh→sw_cp→base_cp, factor = 1, f=25% (s=1.0)
  # ────────────────────────────────────────────────────────────────────
  - name: csr_full_d2wp_k1_tl25
    timelimit: "0.09nc"
    output_subdir: csr_full_d2wp_k1_tl25
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 1
        timelimit: "0.0225nc"
        idle_mode: "lookahead"
        solve_flow:
          - method: calc_mcf_lb_and_derive_full_sch
            draw_pmtn_sch_heatmap: false
            job_placement_priority: "end_time"
            last_stage_only_placement_criteria: "dist"
            makespan_delta_ref: "lastStageOnlyMakespan"
            adjust_p: true
            adjust_r: true
            r_adjust_coeff: 0.5
            proceed_r2_when_nonpositive_cmax: true
          - method: run_flip_makespan_cp_from_incumbent
            cp_tl: "0.00225nc"
            solver_thread_cnt: 8
            log_search_progress: false
            emit_phase_schedules: false
          - method: neh_cp
            job_priority: "due2-weight-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.00675nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.00125
            rj_right_justify_scope: "rtf_only"
            idle_mode: "lookahead"
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8
  # ────────────────────────────────────────────────────────────────────
  # csr_neh_d2wp: neh→sw_cp→base_cp, factor = 1, f=25% (s=1.0)
  # ────────────────────────────────────────────────────────────────────
  - name: csr_neh_d2wp_k1_tl25
    timelimit: "0.09nc"
    output_subdir: csr_neh_d2wp_k1_tl25
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 1
        timelimit: "0.0225nc"
        idle_mode: "lookahead"
        solve_flow:
          - method: neh_cp
            job_priority: "due2-weight-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.00675nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.00125
            rj_right_justify_scope: "rtf_only"
            idle_mode: "lookahead"
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8
