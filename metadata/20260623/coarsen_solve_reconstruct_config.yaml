# Pilot experiment: extreme coarsen + base CP solve + reconstruct (CSR).
#
# RQ1: Does coarsening processing times and due windows by factor=50 let base
#      CP-SAT prove optimality (or reach a good bound) quickly?
# RQ2: How does the reconstructed original-scale schedule compare to NEH-CP
#      and LB-init (calc_mcf_lb_and_derive_full_sch) baselines?
#
# Three scenarios — CP-SAT solution pool (csr50_pool) excluded in v1;
# add after single-solution RQ2 results justify pool overhead.
#
# See plans/20260623/coarsen_solve_reconstruct.md for full design.

run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
ins_index: [60, 61, 63, 64, 68, 150, 152, 155, 246, 248]
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260623

instance_worker_cnt: 12

draw_gantt: true
painter_thread_cnt: 96

scenarios:
  - name: csr50_only
    timelimit: "0.09nc"
    output_subdir: csr50_only
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 50
        solver_thread_cnt: 8
        timelimit: "0.09nc"
