# coarsen_solve_reconstruct pilot experiment config.
#
# Scenarios:
#   csr50_only        — coarsen factor 50, pure reconstruct (no refinement).
#   csr25_only        — coarsen factor 25, pure reconstruct (no refinement).
#   neh_cp_baseline   — NEH-CP baseline for RQ2 comparison.
#   lb_init_baseline  — MCF-LB init baseline for RQ2 comparison.
#
# draw_gantt / emit_phase_schedules / draw_cp_trajectory are enabled so each
# CSR run emits the 3-Gantt artifact and the CP UB/LB trajectory line graph.
#
# See plans/experiment/20260623/coarsen_solve_reconstruct.md and
#     plans/experiment/20260623/coarsen_solve_reconstruct_figures.md.

run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
# ins_index: [60, 61, 63, 64, 68, 150, 152, 155, 246, 248]
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260623

instance_worker_cnt: 12

draw_gantt: true
painter_thread_cnt: 16

scenarios:
  - name: csr50_only
    timelimit: "0.09nc"
    output_subdir: csr50_only
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 50
        timelimit: "0.03nc"
        solver_thread_cnt: 8
        emit_phase_schedules: true
        draw_cp_trajectory: true

  - name: csr25_only
    timelimit: "0.09nc"
    output_subdir: csr25_only
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 25
        timelimit: "0.03nc"
        solver_thread_cnt: 8
        emit_phase_schedules: true
        draw_cp_trajectory: true

