run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
# Small instances — CP-SAT can reach LB-tight solutions to exercise
# (a) last-batch obj_lb optimality short-circuit (commit 6ad837e), and
# (b) multi-step skip via _optimality_proven (commit 27ee89f).
ins_index: [ 0, 1, 2, 3 ]
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260506

instance_worker_cnt: 4

draw_gantt: false
painter_thread_cnt: 16

scenarios:
  # S4 (6ad837e): last-batch obj_lb threaded into CP-SAT.
  # Generous outer TL (60s) so CP-SAT has room to prove optimality on
  # the last batch when its solution matches the global LB.
  # Verify: per-instance elapsed_time is well below total_timelimit on
  # instances where the bound is tight; CP-SAT log shows OPTIMAL on the
  # final batch shortly after objective reaches the bound.
  - name: mcf_lb_then_neh_cp_lb_optimality
    timelimit: 60.0
    output_subdir: mcf_lb_then_neh_cp_lb_optimality
    subroutine_flow:
      - method: run_mcf_lb_then_neh_cp
        solver_thread_cnt: 8
        added_batch_size: 15
        cp_tl: "0.024nc"
        neh_cp_total_timelimit: "0.024nc"
        batch_tl_mode: "linear"
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true

  # S5 (27ee89f): multi-step skip via _optimality_proven.
  # If step 1 (calc_mcf_lb_and_derive_full_sch) yields ceil(LB)==int(UB),
  # step 2 (neh_cp) must short-circuit at its pre-flight
  # is_stopping_condition() guard and return immediately.
  # Verify: on instances where step 1 proves optimality, step 2's
  # elapsed_time is ~0 in instance_result.yaml.
  - name: calc_mcf_lb_then_skip_neh_cp
    timelimit: 60.0
    output_subdir: calc_mcf_lb_then_skip_neh_cp
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        adjust_p: true
        adjust_r: true
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.024nc"
        batch_tl_mode: "linear"
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
