# Best(NEH-CP, MCF-LB) experiment.
# NEH-CP: neh_cp_bs15_linear_dplus2_pf1_tl024nc from 20260427T025803_513725
# MCF-LB: best_mcf_lb_cp_asis from 20260427T123656_726782

run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
# ins_index: [ 0, 1, 2, 3 ]
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv  # optional; enables post-run pivot artifacts (RPDf / win-tie / time%)

output_dir: output/20260429

instance_worker_cnt: 12

draw_gantt: false
painter_thread_cnt: 48

scenarios:
  - name: neh_cp_bs15_linear_dplus2_pf1_tl024nc
    timelimit: 120.0
    output_subdir: neh_cp_bs15_linear_dplus2_pf1_tl024nc
    subroutine_flow:
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.024nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
  - name: best_mcf_lb_cp_asis
    timelimit: 300.0
    output_subdir: best_mcf_lb_cp_asis
    subroutine_flow:
      - method: run_mcf_lb_4
        last_stage_only_priority_tags: [ "start_time", "due2-weight-pos" ]
        last_stage_only_cp_pf_method: "PF1"
        last_stage_only_cp_solver_thread_cnt: 1
        last_stage_only_tl: null
        repeat_last_stage_only_cp_while_improving: true
        log_last_stage_only_cp_search_progress: false
        machine_then_job: false
        full_cp_pf_method: "PF1"
        full_cp_solver_thread_cnt: 1
        full_cp_tl: null
        repeat_full_cp_while_improving: true
        log_full_cp_search_progress: false
  - name: best
    timelimit: 300.0
    output_subdir: best
    subroutine_flow:
      - method: run_mcf_lb_4
        last_stage_only_priority_tags: [ "start_time", "due2-weight-pos" ]
        last_stage_only_cp_pf_method: "PF1"
        last_stage_only_cp_solver_thread_cnt: 1
        last_stage_only_tl: null
        repeat_last_stage_only_cp_while_improving: true
        log_last_stage_only_cp_search_progress: false
        machine_then_job: false
        full_cp_pf_method: "PF1"
        full_cp_solver_thread_cnt: 1
        full_cp_tl: null
        repeat_full_cp_while_improving: true
        log_full_cp_search_progress: false
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.024nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
