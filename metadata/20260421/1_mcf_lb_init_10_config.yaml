# LB-init experiment config: sort jobs by MCF start time, then dispatch.
# Ref: plans/20260419/mcf_lb_init_dispatch.md
# `repeat_pf_cp_while_improving: true` now drives BOTH the Phase 2
# last-stage solve and the Phase 4 full profile-fix solve loops.
# Ref: plans/20260421/phase4-repeat-pf-cp-loop.md

run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY
# POST_PROCESS_ONLY target (pick one; full path wins if both are set):
# analysis_dir_path: output/20260418T231308_268427
# analysis_timestamp: 20260421T105325_932047

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
ins_index: [ 0, 1 ]

output_dir: output

# Parallel workers for throughput-oriented experimentation.
instance_worker_cnt: 48

# Gantt chart rendering. Post-run only; set false to skip entirely.
draw_gantt: false
painter_thread_cnt: 48

scenarios:
  - name: avg_time
    timelimit: 300.0
    output_subdir: avg_time
    subroutine_flow:
      - method: run_mcf_lb_4
        last_stage_only_priority_tags: [ "avg_time" ]
        profile_fix_by_machine: true
        machine_precedence_stride: 1
        repeat_pf_cp_while_improving: true
  - name: avg_time_minus_half_p
    timelimit: 300.0
    output_subdir: avg_time_minus_half_p
    subroutine_flow:
