# WxD dispatch sweep: ascending by abs(w⁺-w⁻) * (d_j - d_bar),
# decoded via reverse-instance dispatch (min makespan) + IIT.
# Reported objective: weighted earliness + tardiness.

run_mode: FULL_RUN

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260427

instance_worker_cnt: 48

draw_gantt: false
painter_thread_cnt: 16

scenarios:
  - name: w1
    timelimit: 300.0
    output_subdir: w1
    subroutine_flow:
      - method: initialize_by_w1
  - name: wxd3
    timelimit: 300.0
    output_subdir: wxd3
    subroutine_flow:
      - method: initialize_by_wxd3
