# profile-fixed CP-SAT experiment: seed with MCF-LB, then refine via
# CP-SAT solving under fixed dispatch profile (precedence arcs derived
# from the incumbent).
# Ref: plans/20260419/profile_fixed_ns.md

run_mode: FULL_RUN        # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
# ins_index: [1439]

output_dir: output

instance_worker_cnt: 96

draw_gantt: false
painter_thread_cnt: 32

scenarios:
  - name: profile_fixed_ns
    timelimit: 600.0
    output_subdir: profile_fixed_ns
    subroutine_flow:
      - method: run_mcf_lb
      - method: run_profile_fixed_ns
        params:
          computational_time: 300.0
          solver_thread_cnt: 1
          pf_method: "PF1"
