run_mode: FULL_RUN        # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
# ins_index: [0, 1439]

output_dir: output

# Parallel workers for throughput-oriented experimentation.
instance_worker_cnt: 48

# Gantt chart rendering. Post-run only; set false to skip entirely.
draw_gantt: false
painter_thread_cnt: 16

scenarios:
  - name: edd_fam
    timelimit: 300.0
    output_subdir: edd_fam
    subroutine_flow:
      - method: initialize_by_edd
        dispatcher: fam
  - name: edd_fam_profile_fixed_ns
    timelimit: 600.0
    output_subdir: profile_fixed_ns
    subroutine_flow:
      - method: initialize_by_edd
        dispatcher: fam
      - method: run_profile_fixed_ns
        params:
          computational_time: 300.0
          solver_thread_cnt: 1
          profile_fix_by_machine: true
          machine_precedence_stride: 1
