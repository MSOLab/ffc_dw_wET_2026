# POST_PROCESS_ONLY: CSR κ=1 f=30% B30 (batch=m vs m+2) vs C5 baseline v1/v2.
# Merged run dir built by scripts/build_merged_run_dir.py from:
#   b30_csr_k1_f30_batch_m        <- 20260722T013555_184612/b30_csr_k1_f30_batch_m
#   b30_csr_k1_f30_batch_m_plus_2 <- 20260721T015603_278451/b30_csr_k1_f30_batch_m_plus_2
#   a_v1_const018_max6            <- .../a_v1_const018_max6
#   a_v2_kappa005_max8            <- .../a_v2_kappa005_max8
#
# Comparison: (1) C5 init vs CSR init, (2) ISW-CP TL policy, (3) batch=m vs batch=m+2.
run_mode: POST_PROCESS_ONLY
analysis_dir_path: output/20260722_csr_b30_vs_a_v1_v2/20260722T090801_437425

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260722_csr_b30_vs_a_v1_v2

instance_worker_cnt: 12
draw_gantt: false
draw_progress_plot: false
painter_thread_cnt: 8

scenarios:
  # ---- B30 batch=m: CSR κ=1 f=30%, outer ISW-CP constant 0.018nc batch=m ----------
  - name: b30_csr_k1_f30_batch_m
    timelimit: "0.09nc"
    output_subdir: b30_csr_k1_f30_batch_m
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 1
        timelimit: "0.0270nc"
        idle_mode: "lookahead"
        solve_flow:
          - method: calc_mcf_lb_and_derive_full_sch
            draw_pmtn_sch_heatmap: false
            job_placement_priority: "end_time"
            last_stage_only_placement_criteria: "dist"
            makespan_delta_ref: "lastStageOnlyMakespan"
            adjust_p: true
            adjust_r: true
            r_adjust_coeff: 0.5
            proceed_r2_when_nonpositive_cmax: true
          - method: run_flip_makespan_cp_from_incumbent
            cp_tl: "0.00270nc"
            solver_thread_cnt: 8
            log_search_progress: false
            emit_phase_schedules: false
          - method: neh_cp
            job_priority: "due2-weight-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.00810nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.0015
            rj_right_justify_scope: "rtf_only"
            idle_mode: "lookahead"
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 6
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        total_timelimit: "0.018nc"
        batch_tl_mode: "constant"
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

  # ---- B30 batch=m+2: CSR κ=1 f=30%, outer ISW-CP constant 0.018nc batch=m+2 --------
  - name: b30_csr_k1_f30_batch_m_plus_2
