# A/B smoke: `idle_mode` 필드 제거로 top-level `incremental_sw_cp` 의
# idle-time insertion 이 flooring -> lookahead 로 바뀌는 효과 측정.
#
# 계획: plans/experiment/20260722/csr_idle_mode_lookahead_only.md §5.3
#
# 시나리오는 metadata/20260721/csr_init_isw_batch_smoke.yaml 의 A / B30 을
# 그대로 가져오되 **`idle_mode` 키를 전부 제거**했다 (그 키가 제거 대상이므로).
#   A    CSR 없음, 전 구간 K=1 — top-level ISW-CP 효과가 단독으로 드러남
#   B30  CSR κ=1 init + top-level ISW-CP — CSR 안쪽 sw_cp 까지 함께 바뀜
#
# 인스턴스: (n, c, totalMcCount) 16개 셀마다 2개씩 = 32개.
# CP-SAT 이 wall-clock TL + 8 thread 라 run-to-run 비결정적이므로, 같은 코드로
# 한 번 더 돌린 repeat run 을 노이즈 바닥(noise floor)으로 함께 잰다.

run_mode: FULL_RUN

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

ins_index: [0, 1, 90, 91, 180, 181, 270, 271, 360, 361, 450, 451, 540, 541, 630, 631, 720, 721, 810, 811, 900, 901, 990, 991, 1080, 1081, 1170, 1171, 1260, 1261, 1350, 1351]
output_dir: output/20260722_idle_mode_ab

instance_worker_cnt: 12
draw_gantt: false
draw_progress_plot: false
painter_thread_cnt: 1

scenarios:
  # ---- A: C5 as it stands today (baseline) ----------------------------
  - name: a_c5_batch_m
    timelimit: "0.09nc"
    output_subdir: a_c5_batch_m
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.009nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.027nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 6
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        total_timelimit: "0.018nc"
        batch_tl_mode: "constant"
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

  # ---- B30: CSR κ=1 @ f=30% initializer, ISW-CP batch m+2 -------------
  - name: b30_csr_k1_f30_batch_m_plus_2
    timelimit: "0.09nc"
    output_subdir: b30_csr_k1_f30_batch_m_plus_2
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 1
        timelimit: "0.0270nc"
        solve_flow:
          - method: calc_mcf_lb_and_derive_full_sch
            draw_pmtn_sch_heatmap: false
            job_placement_priority: "end_time"
            last_stage_only_placement_criteria: "dist"
            makespan_delta_ref: "lastStageOnlyMakespan"
            adjust_p: true
            adjust_r: true
            r_adjust_coeff: 0.5
            proceed_r2_when_nonpositive_cmax: true
          - method: run_flip_makespan_cp_from_incumbent
            cp_tl: "0.00270nc"
            solver_thread_cnt: 8
            log_search_progress: false
            emit_phase_schedules: false
          - method: neh_cp
            job_priority: "due2-weight-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.00810nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.0015
            rj_right_justify_scope: "rtf_only"
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        extra_batch_size_expr: 2
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 6
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        total_timelimit: "0.018nc"
        batch_tl_mode: "constant"
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8
