run_mode: FULL_RUN

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260804_job_batch_cp_compare

instance_worker_cnt: 12
draw_gantt: false
draw_progress_plot: true
painter_thread_cnt: 96

# 2 job_batch_cp arms, flow is dispatch_v4 -> MCF-LB -> FMM -> job_batch_cp
# (no ISW-CP / base CP tail).  job sequences mirror those in
# neh_cp_last1_stage_seq.yaml (completion-end-stage=-2, midpoint-end-stage=-2
# with completion tiebreak).
#
# Plan: plans/experiment/20260804/job_batch_cp.md
scenarios:
  # ── arm 1: completion_seq with (last-1) end stage ────────────────────────────
  - name: dv4_mcf_fmm_job_batch_cp_completion3_seq
    timelimit: "0.09nc"
    output_subdir: job_batch_cp_compare/dv4_mcf_fmm_job_batch_cp_completion3_seq
    subroutine_flow:
      - method: initialize_by_dispatch_v4
        reconstruct_mode: "active_but_last_semi"
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.0036nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: job_batch_cp_completion_seq
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        batch_size: 15
        total_timelimit: "0.0108nc"
        batch_tl_mode: "linear"
        pf_method: "PF1"
        seq_end_stage: -2

  # ── arm 2: midpoint_seq with (last-1) end stage + completion tiebreak ────────
  - name: dv4_mcf_fmm_job_batch_cp_midpoint3_seq
    timelimit: "0.09nc"
    output_subdir: job_batch_cp_compare/dv4_mcf_fmm_job_batch_cp_midpoint3_seq
    subroutine_flow:
      - method: initialize_by_dispatch_v4
        reconstruct_mode: "active_but_last_semi"
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.0036nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: job_batch_cp_midpoint_seq
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        batch_size: 15
        total_timelimit: "0.0108nc"
        batch_tl_mode: "linear"
        pf_method: "PF1"
        seq_tiebreak: "completion"
        seq_end_stage: -2
