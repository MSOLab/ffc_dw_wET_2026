# POST_PROCESS_ONLY report over a merged run dir (scripts/build_merged_run_dir.py).
#
# Extends metadata/20260804/merge_neh_cp_seq_tiebreak.yaml (6 arms) with the two
# (last-1) stage treatments, giving one 8-scenario x 1440 comparison of every
# NEH-CP job-insertion order tried so far.  Sources:
#   output/20260731_neh_cp_seq_source_compare/20260801T012922_726471   (run A)
#   output/20260803_neh_cp_midpoint_tiebreak/20260804T001517_995533    (run C)
#   output/20260804_neh_cp_last1_stage_seq/20260804T213652_830716      (run D)
# All eight share the same flow (dispatch_v4 -> MCF-LB -> FMM -> NEH-CP) and the
# same budget, so they are directly comparable; only the NEH-CP job-insertion
# order differs.
#
#   dv4_mcf_fmm_neh_cp_midpoint_seq       run A  midpoint   (m -> fs -> rank)
#   dv4_mcf_fmm_neh_cp_midpoint_seq_rep   run C  midpoint   (same config, replicate)
#   dv4_mcf_fmm_neh_cp_midpoint2_seq      run C  midpoint + seq_tiebreak: completion
#   dv4_mcf_fmm_neh_cp_first_stage_seq    run A  first_stage
#   dv4_mcf_fmm_neh_cp_completion_seq     run A  completion
#   dv4_mcf_fmm_neh_cp_job_priority       run C  instance rule (due2-weight-pos)
#   dv4_mcf_fmm_neh_cp_completion3_seq    run D  completion + seq_end_stage: -2
#   dv4_mcf_fmm_neh_cp_midpoint3_seq      run D  midpoint + tiebreak completion + seq_end_stage: -2
#
# The run D arms have no in-run control here: their controls (completion_seq /
# midpoint2_seq) come from runs A and C, so every contrast involving them is
# CROSS-RUN and carries the +-0.451 pp replicate band measured in
# plans/analysis/20260801/neh_cp_seq_replicate.md.
#
# draw_gantt / draw_progress_plot must stay false: those painters write inside
# instance dirs, which are symlinks into the source runs.
run_mode: POST_PROCESS_ONLY
analysis_dir_path: output/20260804_merge_neh_cp_last1_stage_seq/20260804T233244_618881
benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv
draw_gantt: false
draw_progress_plot: false
painter_thread_cnt: 96
scenarios:
- name: dv4_mcf_fmm_neh_cp_midpoint_seq
  timelimit: 0.09nc
  output_subdir: dv4_mcf_fmm_neh_cp_midpoint_seq
  subroutine_flow:
  - method: initialize_by_dispatch_v4
    reconstruct_mode: active_but_last_semi
  - method: calc_mcf_lb_and_derive_full_sch
    draw_pmtn_sch_heatmap: false
    job_placement_priority: end_time
    last_stage_only_placement_criteria: dist
    makespan_delta_ref: lastStageOnlyMakespan
    adjust_p: true
    adjust_r: true
    r_adjust_coeff: 0.5
    proceed_r2_when_nonpositive_cmax: true
  - method: run_flip_makespan_cp_from_incumbent
    cp_tl: 0.0036nc
    solver_thread_cnt: 8
    log_search_progress: false
    emit_phase_schedules: false
  - method: neh_cp_midpoint_seq
    job_priority: due2-weight-pos
    solver_thread_cnt: 8
    added_batch_size: 15
    total_timelimit: 0.0108nc
    batch_tl_mode: linear
    apply_cumulative_tl: false
    pf_method: PF1
    skip_pf_below_obj: makespan
    make_semi_active_after_cp: true
    minimize_makespan_lex: false
