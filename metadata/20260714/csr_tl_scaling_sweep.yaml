run_mode: FULL_RUN

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260714_csr_tl_scaling_sweep

instance_worker_cnt: 12
draw_gantt: false
draw_progress_plot: false
painter_thread_cnt: 1

# CSR time-budget scaling sweep run
# 계획: plans/experiment/20260714/csr_tl_scaling_sweep.md
#
# 스윕 변수 = CSR budget 비율 f 하나. 표준 reference 예산(outer 0.09nc) 대비 CSR
# 단계에 배정하는 비율을 {5,10,15,20,30}% 로 스윕(25% 는 선행 run
# output/20260714_csr_full_grid_k248/20260714T184236_642971 재사용). 각 f 에서
# 비례 스케일 s=f/0.25 를 네 TL knob(CSR timelimit / flip cp_tl / neh
# total_timelimit / sw_cp kappa)에 동일 적용 → CSR 예산 내부 배분 비율을 전
# 비율에서 고정, 스윕 변수를 "CSR 총예산" 하나로 고립.
#
# 범위: full 1440-grid × K{1,2,4,8} × 2 flow(csr_full_d2wp / csr_neh_d2wp)
#   × 5 f = 40 scenario = 57,600 instance-run. K=1 = factor 1(coarsening 없음,
#   원해상도) 기준선 추가 — coarsening 이득/손실을 원scale 대비 절대측정.
# outer timelimit 0.09nc 전 시나리오 고정(CSR eff = 0.09·f 라 bind 안 함).
# mcf 는 TL 인자 없어 스케일 없음; base_cp 는 CSR 잔여를 자동 흡수해 s배.
#
# 판정: BKS 대비 RPDf(대칭). 6점(5/10/15/20/25/30%) f→RPDf 곡선을 (K,flow)별로.
# optimality gap 금지(coarse time_factor>1 로 obj_bound loose).
# solver 설정(thread 8, batch_size, pf_method 등)은 선행 config 와 동일.
scenarios:
  # ────────────────────────────────────────────────────────────────────
  # csr_full_d2wp: mcf→flip→neh→sw_cp→base_cp, factor = K, TL scaled by s=f/0.25
  # ────────────────────────────────────────────────────────────────────
  - name: csr_full_d2wp_k1_tl05
    timelimit: "0.09nc"
    output_subdir: csr_full_d2wp_k1_tl05
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 1
        timelimit: "0.0045nc"
        idle_mode: "lookahead"
        solve_flow:
          - method: calc_mcf_lb_and_derive_full_sch
            draw_pmtn_sch_heatmap: false
            job_placement_priority: "end_time"
            last_stage_only_placement_criteria: "dist"
            makespan_delta_ref: "lastStageOnlyMakespan"
            adjust_p: true
            adjust_r: true
            r_adjust_coeff: 0.5
            proceed_r2_when_nonpositive_cmax: true
          - method: run_flip_makespan_cp_from_incumbent
            cp_tl: "0.00045nc"
            solver_thread_cnt: 8
            log_search_progress: false
            emit_phase_schedules: false
          - method: neh_cp
            job_priority: "due2-weight-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.00135nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.00025
            rj_right_justify_scope: "rtf_only"
            idle_mode: "lookahead"
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8
