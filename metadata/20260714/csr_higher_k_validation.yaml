# coarse-exact insert_idle_time — higher-K 검증 run (commit 9b7ad2a)
# 계획: plans/experiment/20260714/coarse_exact_higher_k_validation.md
#
# 목적: K ∈ {2, 4, 8, 16, 32} 전역에서 두 warning
#   - sw_cp dispatcher: "insert_idle_time left E/T on the table"
#   - CpsatAdapter: "post-process objective ... > CP-SAT objective"
# 이 전무하고, sw_cp hard assert(rj_obj <= inc_obj) 크래시가 없음을 확인해
# K=4-only caveat 를 종결한다.
#
# 시나리오: [csr_neh_d2wp, csr_full_d2wp] × K{2,4,8,16,32} = 10.
# instance: 160 subset (위 ins_index) → 총 1600 instance-run.
#
# TL 정책 (의도적으로 K 무관 = K=4 값 고정): inner TL(0.00675nc 등)·CSR
# 0.0225nc 를 K 와 무관하게 그대로 둔다. higher K = 더 작은 coarse 문제 +
# 같은 TL ⇒ CP-SAT 가 최적을 더 자주 증명(cp_obj=0 witness) ⇒ 불변식
# obj_value <= cp_obj 를 더 강하게 테스트. TL 을 K 로 줄이면 witness 가
# 약해져 테스트가 물러짐 — 하지 말 것.
#
# solver 설정은 metadata/20260713/csr_init_methods.yaml 의 동명 시나리오와
# 동일(factor 만 K별로 변경, plotting 만 비활성).
scenarios:
  # ────────────────────────────────────────────────────────────────────
  # csr_full_d2wp: mcf→flip→neh→sw_cp→base_cp + 25% TL, factor = K
  # (inner flow 전체를 태워 insert_idle_time 호출 경로를 가장 넓게 커버)
  # ────────────────────────────────────────────────────────────────────
  - name: csr_full_d2wp_k2
    timelimit: "0.09nc"
    output_subdir: csr_full_d2wp_k2
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 2
        timelimit: "0.0225nc"
        idle_mode: "lookahead"
        solve_flow:
          - method: calc_mcf_lb_and_derive_full_sch
            draw_pmtn_sch_heatmap: false
            job_placement_priority: "end_time"
            last_stage_only_placement_criteria: "dist"
            makespan_delta_ref: "lastStageOnlyMakespan"
            adjust_p: true
            adjust_r: true
            r_adjust_coeff: 0.5
            proceed_r2_when_nonpositive_cmax: true
          - method: run_flip_makespan_cp_from_incumbent
            cp_tl: "0.00225nc"
            solver_thread_cnt: 8
            log_search_progress: false
            emit_phase_schedules: false
          - method: neh_cp
            job_priority: "due2-weight-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.00675nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.00125
            rj_right_justify_scope: "rtf_only"
            idle_mode: "lookahead"
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8

