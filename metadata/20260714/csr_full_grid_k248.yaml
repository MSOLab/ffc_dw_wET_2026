run_mode: FULL_RUN

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
# ins_index: [60, 61, 63, 64, 68, 150, 152, 155, 246, 248]
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260714_csr_full_grid_k248

instance_worker_cnt: 12
draw_gantt: false
draw_progress_plot: false
painter_thread_cnt: 1

# CSR full-grid K∈{2,4,8} setting-selection run
# 계획: plans/20260714/csr_full_grid_k248_selection.md
#
# 목적 (게이트가 아니라 선택): fixed budget 하에서 어떤 (init-flow, K) 조합이
# full 1440-grid 에서 가장 낮은 weighted E/T (= 최저 RPD) 를 내는가?
# 정확성은 선행 게이트(plans/20260714/coarse_exact_higher_k_validation.md,
# warning/crash 0) 에서 이미 확보 — 여기선 해 품질(RPD·win/tie)만 본다.
#
# 범위: full 1440-grid (ins_index 제거) × K{2,4,8} × 2 scenario
#   = 8640 instance-run.
# K 선정: 선행 160-subset 에서 두 시나리오 평균 obj minimum 이 K=2(full)·
# K=8(neh) 에 위치 → {2,4,8} 이 관측 최적점을 브래킷. K16/32 는 K≤8 대비
# ~8% 열위라 제외.
#
# Budget 정책 (equal-budget — 의도적으로 K 무관): 6개 조합 전부 동일 예산.
# outer 0.09nc / CSR 0.0225nc / inner TL(neh 0.00675nc, flip 0.00225nc,
# kappa 0.00125) 전부 K=4 값 그대로. validation 과 config 는 같지만 이유가
# 다름 — 여기선 "K 효과 vs budget 효과" 교란을 막기 위한 공정성 근거.
# 작은 K(=2)=더 큰 coarse 문제 ⇒ 같은 TL 안에 CP-SAT 덜 끝남,
# 큰 K(=8)=더 작은 coarse 문제 ⇒ TL 을 다 못 씀. 이 트레이드오프의 순효과가
# 곧 "budget 고정 시 best K" 이며 본 실험의 측정 대상.
#
# 판정: BKS 대비 RPD(1차) + pairwise win/tie·size-group 승자 분해(2차).
# optimality gap 금지 — coarse 는 time_factor>1 로 obj_bound=0(loose global LB).
#
# solver 설정은 metadata/20260713/csr_init_methods.yaml 의 동명 시나리오와
# 동일(factor 만 K별로 변경, plotting 만 비활성).
scenarios:
  # ────────────────────────────────────────────────────────────────────
  # csr_full_d2wp: mcf→flip→neh→sw_cp→base_cp + 25% TL, factor = K
  # ────────────────────────────────────────────────────────────────────
  - name: csr_full_d2wp_k2
    timelimit: "0.09nc"
    output_subdir: csr_full_d2wp_k2
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 2
        timelimit: "0.0225nc"
        idle_mode: "lookahead"
        solve_flow:
          - method: calc_mcf_lb_and_derive_full_sch
            draw_pmtn_sch_heatmap: false
            job_placement_priority: "end_time"
            last_stage_only_placement_criteria: "dist"
            makespan_delta_ref: "lastStageOnlyMakespan"
            adjust_p: true
            adjust_r: true
            r_adjust_coeff: 0.5
            proceed_r2_when_nonpositive_cmax: true
          - method: run_flip_makespan_cp_from_incumbent
            cp_tl: "0.00225nc"
            solver_thread_cnt: 8
            log_search_progress: false
            emit_phase_schedules: false
          - method: neh_cp
            job_priority: "due2-weight-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.00675nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.00125
            rj_right_justify_scope: "rtf_only"
            idle_mode: "lookahead"
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8

