# LB-init experiment config: sort jobs by MCF start time, then dispatch.
# Ref: plans/20260419/mcf_lb_init_dispatch.md

run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY
# POST_PROCESS_ONLY target (pick one; full path wins if both are set):
# analysis_dir_path: output/20260418T231308_268427
# analysis_timestamp: 20260421T105325_932047

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
ins_index: [0, 1439]

output_dir: output

# Parallel workers for throughput-oriented experimentation.
instance_worker_cnt: 16

# Gantt chart rendering. Post-run only; set false to skip entirely.
draw_gantt: false
painter_thread_cnt: 16

scenarios:
  - name: start_time
    timelimit: 300.0
    output_subdir: start_time
    subroutine_flow:
      - method: run_mcf_lb_4
        last_stage_only_priority_tags: [ "start_time" ]
        last_stage_only_cp_pf_method: "PF1"
        last_stage_only_cp_solver_thread_cnt: 1
        last_stage_only_cp_tl: null
        repeat_last_stage_only_cp_while_improving: true
        log_last_stage_only_cp_search_progress: false
        machine_then_job: false
        full_cp_pf_method: "PF1"
        full_cp_solver_thread_cnt: 1
        full_cp_tl: null
        repeat_full_cp_while_improving: true
        log_full_cp_search_progress: false
  - name: due2-weight-pos
    timelimit: 300.0
    output_subdir: due2-weight-pos
    subroutine_flow:
      - method: run_mcf_lb_4
        last_stage_only_priority_tags: [ "due2-weight-pos" ]
        last_stage_only_cp_pf_method: "PF1"
        last_stage_only_cp_solver_thread_cnt: 1
        last_stage_only_cp_tl: null
        repeat_last_stage_only_cp_while_improving: true
        log_last_stage_only_cp_search_progress: false
        machine_then_job: false
        full_cp_pf_method: "PF1"
        full_cp_solver_thread_cnt: 1
        full_cp_tl: null
        repeat_full_cp_while_improving: true
        log_full_cp_search_progress: false
  - name: best_mcf_lb
    timelimit: 300.0
    output_subdir: best_mcf_lb
    subroutine_flow:
      - method: run_mcf_lb_4
        last_stage_only_priority_tags: [ "start_time", "due2-weight-pos" ]
        last_stage_only_cp_pf_method: "PF1"
        last_stage_only_cp_solver_thread_cnt: 1
        last_stage_only_cp_tl: null
        repeat_last_stage_only_cp_while_improving: true
        log_last_stage_only_cp_search_progress: false
        machine_then_job: false
        full_cp_pf_method: "PF1"
        full_cp_solver_thread_cnt: 1
        full_cp_tl: null
        repeat_full_cp_while_improving: true
        log_full_cp_search_progress: false
