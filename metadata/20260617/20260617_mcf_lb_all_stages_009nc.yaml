run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
ins_index: [0, 10, 20, 30, 40, 50, 60, 70, 80]  # uncomment for smoke test
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260617

instance_worker_cnt: 48

draw_gantt: false

scenarios:
  - name: mcf_lb_last_stage
    output_subdir: mcf_lb_last_stage
    timelimit: "0.09nc"
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        lb_stage_scope: last_stage
  - name: mcf_lb_all_stages
    output_subdir: mcf_lb_all_stages
    timelimit: "0.09nc"
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        lb_stage_scope: all_stages
        adjust_p: true
        adjust_r: true
        proceed_r2_when_nonpositive_cmax: true
  - name: mcf_lb_last_stage_seedcmp
    output_subdir: mcf_lb_last_stage_seedcmp
    timelimit: "0.09nc"
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        lb_stage_scope: last_stage
        seed_compare: true
  - name: mcf_lb_all_stages_seedcmp
    output_subdir: mcf_lb_all_stages_seedcmp
    timelimit: "0.09nc"
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        lb_stage_scope: all_stages
        adjust_p: true
        adjust_r: true
        proceed_r2_when_nonpositive_cmax: true
        seed_compare: true
