run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
ins_index: [60, 61]
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260711_csr_ab

instance_worker_cnt: 2
draw_gantt: false
draw_progress_plot: true
painter_thread_cnt: 96

# A/B: does a coarse CSR initialization beat the original-scale constructive
# prefix at equal budget? (plans/experiment/20260711/csr_solve_flow.md)
#
# Both arms: total timelimit 0.09nc, identical incremental_sw_cp (kappa 0.005)
# + solve_base_model_cpsat tail.
# - base:     mcf_lb -> flip -> neh_cp prefix on the ORIGINAL instance
#             (explicit prefix TLs: flip 0.009nc + neh 0.027nc = 0.036nc,
#             mcf_lb runs to completion on top).
# - csr_init: the prefix is replaced by ONE coarsen_solve_reconstruct step
#             with timelimit 0.036nc (mirror of the prefix's explicit TLs);
#             its inner solve_flow reuses the csr_subalg.yaml flow and the
#             child controller clamps inner TLs to the 0.036nc budget.
#
# Caveat: single rep per arm; CP-SAT with 8 threads is nondeterministic, so
# treat obj differences below a few percent as noise.
scenarios:
  - name: base
    timelimit: "0.09nc"
    output_subdir: base
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.009nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.027nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 8
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        batch_tl_mode: "proportional"
        non_time_fixed_op_time_limit_multiplier: 0.005
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

  - name: csr_init
    timelimit: "0.09nc"
    output_subdir: csr_init
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 50
        timelimit: "0.036nc" # mirrors base's explicit prefix TLs (0.009 + 0.027)
        solve_flow:
          - method: calc_mcf_lb_and_derive_full_sch
            draw_pmtn_sch_heatmap: false
            job_placement_priority: "end_time"
            last_stage_only_placement_criteria: "dist"
            makespan_delta_ref: "lastStageOnlyMakespan"
            adjust_p: true
            adjust_r: true
            r_adjust_coeff: 0.5
            proceed_r2_when_nonpositive_cmax: true
          - method: run_flip_makespan_cp_from_incumbent
            cp_tl: "0.009nc"
            solver_thread_cnt: 8
            log_search_progress: false
            emit_phase_schedules: false
          - method: neh_cp
            # scale-free job_priority on the coarse instance (see csr_subalg.yaml)
            job_priority: "weight-due-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.027nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.005
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 8
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        batch_tl_mode: "proportional"
        non_time_fixed_op_time_limit_multiplier: 0.005
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8
