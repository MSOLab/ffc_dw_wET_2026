# CSR-in-mix factor sweep: coarsening factor 4 vs 5
# (plans/experiment/20260711/csr_solve_flow.md).
#
# Both scenarios are the ORIGINAL 5-step flow (metadata/20260710/
# sw_cp_tl_kappa_0.005.yaml step kwargs, scenario TL 0.09nc) with ONE extra
# step: coarsen_solve_reconstruct inserted as the LAST initializer (after
# neh_cp, before incremental_sw_cp), budgeted at 10% of the scenario TL
# (0.009nc). The two scenarios differ ONLY in `factor` (4 vs 5).
#
# The CSR inner solve_flow is the original flow itself (minus csr), with its
# explicit step TLs scaled x0.1 so internal time proportions mirror the
# original (flip 0.009nc -> 0.0009nc, neh 0.027nc -> 0.0027nc); kappa is a
# per-window granularity policy, not a phase budget, so it stays 0.005 and
# the child controller's 0.009nc TL enforces the overall 10%.
# NOTE: inner neh job_priority "due2-weight-pos" is kept for flow identity;
# on a coarse instance it mixes coarse p with original due windows (insertion
# ORDER only — the registered objective stays correct; minor at factor 4-5).
# v1 rule: keep child draw / emission / log-search flags OFF.
scenarios:
  - name: csr_f4
    timelimit: "0.09nc"
    output_subdir: csr_f4
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.009nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.027nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: coarsen_solve_reconstruct
        factor: 4
        timelimit: "0.009nc" # 10% of the scenario TL
        solve_flow:
          - method: calc_mcf_lb_and_derive_full_sch
            draw_pmtn_sch_heatmap: false
            job_placement_priority: "end_time"
            last_stage_only_placement_criteria: "dist"
            makespan_delta_ref: "lastStageOnlyMakespan"
            adjust_p: true
            adjust_r: true
            r_adjust_coeff: 0.5
            proceed_r2_when_nonpositive_cmax: true
          - method: run_flip_makespan_cp_from_incumbent
            cp_tl: "0.0009nc"
            solver_thread_cnt: 8
            log_search_progress: false
            emit_phase_schedules: false
          - method: neh_cp
            job_priority: "due2-weight-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.0027nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.005
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 8
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        batch_tl_mode: "proportional"
        non_time_fixed_op_time_limit_multiplier: 0.005
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

  - name: csr_f5
    timelimit: "0.09nc"
