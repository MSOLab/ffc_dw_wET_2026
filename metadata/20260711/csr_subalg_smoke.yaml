run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
ins_index: [60, 61]
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260711_csr_subalg_smoke

instance_worker_cnt: 2
draw_gantt: false
draw_progress_plot: false
painter_thread_cnt: 8

# End-to-end smoke of the CSR configurable solve_flow (small ABSOLUTE time
# limits so the whole run finishes in a couple of minutes). Same shape as
# csr_subalg.yaml but with generous-enough caps that a tiny coarse instance
# (factor=50) proves optimality well within them. All draw / emission flags
# are OFF (the headless child controller has no artifact sink; v1 requirement).
scenarios:
  - name: csr_subalg_smoke
    timelimit: 30 # absolute seconds (global per-instance budget)
    output_subdir: csr_subalg_smoke
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 50
        timelimit: 25 # absolute seconds (CSR budget)
        solve_flow:
          - method: calc_mcf_lb_and_derive_full_sch
            makespan_delta_ref: "lastStageOnlyMakespan"
            adjust_p: true
            adjust_r: true
            r_adjust_coeff: 0.5
            proceed_r2_when_nonpositive_cmax: true
          - method: run_flip_makespan_cp_from_incumbent
            cp_tl: 3
            solver_thread_cnt: 4
            log_search_progress: false
          - method: neh_cp
            job_priority: "weight-due-pos" # scale-free (coarse-instance safe)
            solver_thread_cnt: 4
            added_batch_size: 15
            total_timelimit: 5
            batch_tl_mode: "linear"
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
          - method: incremental_sw_cp
            solver_thread_cnt: 4
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 4
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            cp_tl: 2
            batch_tl_mode: "constant"
          - method: solve_base_model_cpsat
            solver_thread_cnt: 4
            timelimit: 5
