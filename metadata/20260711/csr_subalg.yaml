run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
ins_index: [60, 61]
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260711_csr_subalg

instance_worker_cnt: 2
draw_gantt: false
draw_progress_plot: true
painter_thread_cnt: 96

# CSR configurable solve flow (plans/experiment/20260711/csr_solve_flow.md).
# The `coarsen_solve_reconstruct` step coarsens by factor=50 and runs the inner
# `solve_flow` on the coarsened instance via a headless CHILD controller
# (time_factor=50). Every child registration is a coarse candidate; candidates
# are de-duplicated, reconstructed to the original scale, validated, and the
# original-scale argmin is registered (parent obj_bound stays None — a coarse
# solve is never a valid original-scale bound).
#
# Step-option kwargs mirror metadata/20260710/sw_cp_tl_kappa_0.005.yaml
# (kappa = non_time_fixed_op_time_limit_multiplier = 0.005, solver_thread_cnt 8,
# batch_tl_mode proportional for the sliding window). NOTE: time-limit
# expressions inside solve_flow (e.g. "0.009nc") resolve against the COARSE
# instance, which keeps the same n and c as the original (only p is coarsened),
# so the resolved seconds match the original-instance values.
scenarios:
  - name: csr_subalg
    timelimit: "0.1nc"
    output_subdir: csr_subalg
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 50
        timelimit: "0.09nc" # total CSR budget (child solve + reconstruction)
        # v1: keep child gantt / emission / log-search flags OFF (the headless
        # child controller has no artifact sink).
        solve_flow:
          - method: calc_mcf_lb_and_derive_full_sch
            draw_pmtn_sch_heatmap: false
            job_placement_priority: "end_time"
            last_stage_only_placement_criteria: "dist"
            makespan_delta_ref: "lastStageOnlyMakespan"
            adjust_p: true
            adjust_r: true
            r_adjust_coeff: 0.5
            proceed_r2_when_nonpositive_cmax: true
          - method: run_flip_makespan_cp_from_incumbent
            cp_tl: "0.009nc"
            solver_thread_cnt: 8
            log_search_progress: false
            emit_phase_schedules: false
          - method: neh_cp
            # Coarse-instance quality caveat: prefer a scale-free job_priority.
            # The reference config uses "due2-weight-pos", which mixes coarse p
            # with the original due windows on the coarse instance (heuristic
            # ORDER only — the registered objective stays correct). Use the
            # scale-free "weight-due-pos" here instead.
            job_priority: "weight-due-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.027nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.005
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8
