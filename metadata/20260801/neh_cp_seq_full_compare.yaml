run_mode: FULL_RUN

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
# ins_index: [60, 61, 63]
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260731_neh_cp_seq_source_compare

instance_worker_cnt: 12
draw_gantt: false
draw_progress_plot: true
painter_thread_cnt: 96

# 7 scenarios comparing how many NEH-CP passes to run, and in which sequence
# mode, on one fixed flow:
#   dispatch-v4 -> MCF-LB -> FMM -> NEH-CP(s) -> ISW-CP -> base CP
# Plan: plans/experiment/20260731/neh_cp_incumbent_sequence.md
#
#   single pass (3)   completion / midpoint / first_stage
#   two passes  (3)   completion->midpoint, completion->first_stage,
#                     midpoint->first_stage
#   three passes(1)   completion->midpoint->first_stage
#
# Chaining works because `_run_neh_cp` derives its insertion order from
# `solution_manager.get_incumbent()`: pass k+1 re-derives its order from the
# schedule pass k produced (or from the FMM incumbent, if pass k failed to
# improve on it). The `dist_to_prev_neh` log line reports how far the order
# actually moved between consecutive passes.
#
# Budget: every NEH-CP step keeps `total_timelimit: "0.0108nc"`, so an
# n-pass chain spends n x that on NEH-CP and leaves correspondingly less of
# the 0.09nc scenario budget to ISW-CP / base CP. A chain therefore is NOT
# effort-matched against the single-pass scenarios — a chain win confounds
# "re-deriving the order helps" with "more NEH-CP time helps". Deliberate.
#
# Seeding prefix is fixed to dispatch-v4 -> MCF-LB -> FMM, the best of the
# three prefixes in the 20260801T005425_870711 pilot. `bottleneck` is absent
# because that pilot showed it is a structural alias of `first_stage` — the
# first stage's internal idle is always 0, so the minimum-idle rule always
# selects it. See plans/analysis/20260731/neh_cp_seq_source_pilot.md.
scenarios:
  - name: dv4_mcf_fmm_neh_cp_midpoint_seq_full
    timelimit: "0.09nc"
    output_subdir: neh_cp_seq_source_compare/dv4_mcf_fmm_neh_cp_midpoint_seq
    subroutine_flow:
      - method: initialize_by_dispatch_v4
        reconstruct_mode: "active_but_last_semi"
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.0036nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp_midpoint_seq
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.0108nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 8
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        batch_tl_mode: "proportional"
        non_time_fixed_op_time_limit_multiplier: 0.005
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

