run_mode: FULL_RUN

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260801_neh_cp_budget_allocation

instance_worker_cnt: 12
draw_gantt: false
draw_progress_plot: true
painter_thread_cnt: 96

# 5 scenarios on the full 1440-instance grid, on one fixed flow:
#   dispatch-v4 -> MCF-LB -> FMM -> NEH-CP(s) -> ISW-CP -> base CP
# Plan predecessor: plans/analysis/20260801/neh_cp_pass_chain.md
#
# THE QUESTION THIS RUN EXISTS TO ANSWER
#
# The 20260801T154944_821163 run (7 scenarios, 160 instances, (T,R)=(0.6,0.2))
# found the 3-pass chain `completion -> midpoint -> first_stage` best on flow
# RPDf, but could not say WHY: a chain spends 3 x `0.0108nc` on NEH-CP, so its
# win confounds "re-deriving the insertion order helps" with "more NEH-CP time
# helps". Scenarios s1-s4 below therefore all spend **exactly 0.0324nc** on
# NEH-CP and differ only in how that fixed budget is allocated.
#
#   s0  comp_x1_base        1 pass  @ 0.0108nc, ln 15   <- the cheap default
#   s1  comp_x1_long        1 pass  @ 0.0324nc, ln 15   <- pure time, no re-derive
#   s2  comp_x3_flat        3 passes @ 0.0108nc, ln 15  <- re-derive, key FIXED
#   s3  comp_mid_fs         3 passes @ 0.0108nc, ln 15  <- re-derive, key CHANGES
#   s4  comp_then_comp_2x   0.0108nc/ln15 -> 0.0216nc/ln30
#
# The contrasts, each differing in exactly one thing:
#   s1 vs s2/s3/s4  is the chain win just more NEH seconds? (the equal-allocation
#                   control that plans/analysis/20260801/neh_cp_pass_chain.md
#                   listed as limitation 1)
#   s2 vs s3        does CHANGING the sort key add anything beyond re-deriving
#                   the order from an improved schedule? Nothing measured so far
#                   separates these two.
#   s2 vs s4        two short fine revisits vs one long coarse one.
#   s0 vs the rest  is spending 36 % of the 0.09nc cap on NEH-CP worth it at all?
#   s3              unchanged from 20260801T154944_821163, so it bridges this
#                   full grid back to the 160-instance result.
#
# MECHANISM DIAGNOSTIC (free, already logged)
#
# `dist_to_prev_neh` in s2 measures how far the derived order moves when ONLY
# the schedule changed (same mode both times). If it is ~0, re-derivation is a
# no-op and s1 should beat s2. That one number largely decides the experiment.
#
# READING CAVEATS
#
# - s4's `added_batch_size: 30` interacts with instance size.
#   `neh_cp/dispatcher.py:88` sets first_batch = max(ln, 2*max_m) and chunks the
#   tail by ln, so n=200 runs 7 batches while n=50 runs only 2 -- NEH collapses
#   to near-monolithic CP at the small end. Read s4 per (n, c) cell, never
#   pooled. The 20260428 num_batches sweep (docs/reviews/20260428_weekly_algorithms.md
#   Sec 7-2) already showed batch count is non-monotone.
# - `batch_tl_mode: linear` compounds it: halving the batch count while doubling
#   `total_timelimit` gives s4's second pass ~4x the mean CP time per batch, not 2x.
# - The full grid brings back the ~17 (T=0.2, R=1.0) instances where the seed
#   reaches objective 0 and the stopping condition skips the NEH steps entirely.
#   `analyze_neh_pass_chain.py` counts those as `missing_passes`.
# - `solve_base_model_cpsat` was never reached in any of the 1120 runs of the
#   predecessor -- ISW-CP consumes the whole tail. It is kept here only so the
#   flow stays byte-comparable with 20260801T154944_821163.
#
# `completion` is the fixed mode because it won the 1440-instance grid on the
# NEH step's own output (plans/analysis/20260801/neh_cp_seq_source_full.md,
# result 2). Do NOT cite the flow-level number for that choice -- at flow level
# the modes are indistinguishable (neh_cp_seq_replicate.md).
#
# Budget: ~2.81 h per scenario (1440 instances x 84.4 s mean cap / 12 workers),
# so ~14.1 h for all five.
scenarios:
  - name: dv4_mcf_fmm_comp_x1_base
    timelimit: "0.09nc"
    output_subdir: neh_cp_budget_allocation/dv4_mcf_fmm_comp_x1_base
    subroutine_flow:
      - method: initialize_by_dispatch_v4
        reconstruct_mode: "active_but_last_semi"
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.0036nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp_completion_seq
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.0108nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 8
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        batch_tl_mode: "proportional"
        non_time_fixed_op_time_limit_multiplier: 0.005
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

