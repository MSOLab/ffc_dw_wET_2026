run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
# ins_index: [ 0, 1, 2, 3 ]
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260505

instance_worker_cnt: 96

draw_gantt: false
painter_thread_cnt: 16

scenarios:
  - name: calc_mcf_lb_and_derive_full_sch_adjust_none
    timelimit: 300.0
    output_subdir: calc_mcf_lb_and_derive_full_sch_adjust_none
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        adjust_p: false
        adjust_r: false
  - name: calc_mcf_lb_and_derive_full_sch_adjust_p
    timelimit: 300.0
    output_subdir: calc_mcf_lb_and_derive_full_sch_adjust_p
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        adjust_p: true
        adjust_r: false
  - name: calc_mcf_lb_and_derive_full_sch_adjust_r
    timelimit: 300.0
    output_subdir: calc_mcf_lb_and_derive_full_sch_adjust_r
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        adjust_p: false
        adjust_r: true
  - name: calc_mcf_lb_and_derive_full_sch_adjust_pr
    timelimit: 300.0
    output_subdir: calc_mcf_lb_and_derive_full_sch_adjust_pr
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        adjust_p: true
        adjust_r: true
