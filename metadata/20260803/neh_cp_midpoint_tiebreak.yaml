run_mode: FULL_RUN

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260803_neh_cp_midpoint_tiebreak

instance_worker_cnt: 12
draw_gantt: false
draw_progress_plot: true
painter_thread_cnt: 96

# 3 arm, flow is dispatch_v4 -> MCF-LB -> FMM -> NEH-CP (no ISW-CP / base CP
# tail).  The question is whether the midpoint mode's tie-break key moves NEH-CP
# output, and whether a derived order beats job_priority at equal prefix+budget.
#
# Only midpoint has a distinguishable tie-break alternative:
#   completion + tiebreak=midpoint  ≡  completion  (midpoint monotonic in fs)
#   first_stage + tiebreak=midpoint ≡  first_stage  (midpoint monotonic in ls)
#   midpoint + tiebreak=completion  ≠  midpoint      (ls decreasing in fs for
#     fixed midpoint, so tie-group order reverses)
#
# Plan: plans/experiment/20260803/neh_cp_midpoint_tiebreak.md
scenarios:
  # ── arm 1: treatment (completion tiebreak on midpoint) ──────────────────────
  - name: dv4_mcf_fmm_neh_cp_midpoint2_seq
    timelimit: "0.09nc"
    output_subdir: neh_cp_midpoint_tiebreak/dv4_mcf_fmm_neh_cp_midpoint2_seq
    subroutine_flow:
      - method: initialize_by_dispatch_v4
        reconstruct_mode: "active_but_last_semi"
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.0036nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp_midpoint_seq
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.0108nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
        seq_tiebreak: "completion"

  # ── arm 2: same-run control (default midpoint tiebreak) ─────────────────────
  - name: dv4_mcf_fmm_neh_cp_midpoint_seq
    timelimit: "0.09nc"
    output_subdir: neh_cp_midpoint_tiebreak/dv4_mcf_fmm_neh_cp_midpoint_seq
    subroutine_flow:
      - method: initialize_by_dispatch_v4
        reconstruct_mode: "active_but_last_semi"
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.0036nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp_midpoint_seq
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.0108nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false

  # ── arm 3: job_priority control (same prefix + budget, instance-derived) ────
  - name: dv4_mcf_fmm_neh_cp_job_priority
    timelimit: "0.09nc"
    output_subdir: neh_cp_midpoint_tiebreak/dv4_mcf_fmm_neh_cp_job_priority
    subroutine_flow:
      - method: initialize_by_dispatch_v4
        reconstruct_mode: "active_but_last_semi"
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.0036nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.0108nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
