run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
# ins_index: [ 0, 1, 2, 3 ]
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260503

instance_worker_cnt: 48

draw_gantt: false
painter_thread_cnt: 48

scenarios:
  - name: build_full_sch_p_inc_16
    timelimit: 300.0
    output_subdir: build_full_sch_p_inc_16
    subroutine_flow:
      - method: apply_lb_by_mcf
        draw_heatmap: false
        heatmap_sort: "end_time"
        p_increment: 16
      - method: single_pass_last_stage_only_sch_from_mcf_lb
        job_priority: "end_time"
        placement_priority: "dist"
        pf_method: "PF1"
        solver_thread_cnt: 1
        total_tl: 0.01nc
        log_cp_search_progress: false
        p_increment: 16
      - method: build_full_sch_from_last_stage_only_sch
  - name: build_full_sch_p_inc_32
    timelimit: 300.0
    output_subdir: build_full_sch_p_inc_32
    subroutine_flow:
      - method: apply_lb_by_mcf
        draw_heatmap: false
        heatmap_sort: "end_time"
        p_increment: 32
      - method: single_pass_last_stage_only_sch_from_mcf_lb
        job_priority: "end_time"
        placement_priority: "dist"
        pf_method: "PF1"
        solver_thread_cnt: 1
        total_tl: 0.01nc
        log_cp_search_progress: false
        p_increment: 32
      - method: build_full_sch_from_last_stage_only_sch
