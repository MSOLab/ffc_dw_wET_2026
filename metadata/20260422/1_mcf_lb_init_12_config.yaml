# LB-init experiment config: sort jobs by MCF start time, then dispatch.
# Ref: plans/20260419/mcf_lb_init_dispatch.md

run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY
# POST_PROCESS_ONLY target (pick one; full path wins if both are set):
# analysis_dir_path: output/20260418T231308_268427
# analysis_timestamp: 20260421T105325_932047

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
ins_index: [0]

output_dir: output

# Parallel workers for throughput-oriented experimentation.
instance_worker_cnt: 8

# Gantt chart rendering. Post-run only; set false to skip entirely.
draw_gantt: false
painter_thread_cnt: 8

scenarios:
  - name: mcf_lb_4_4cores_no_pf
    timelimit: 300.0
    output_subdir: mcf_lb_4_4cores_no_pf
    subroutine_flow:
      - method: run_mcf_lb_4
        last_stage_only_priority_tags:
          - "start_time"
        last_stage_only_cp_pf_method: null
        last_stage_only_cp_solver_thread_cnt: 4
        last_stage_only_cp_tl: "0.03nc"
        repeat_last_stage_only_cp_while_improving: false
        log_last_stage_only_cp_search_progress: true
        full_cp_pf_method: null
        full_cp_solver_thread_cnt: 4
        full_cp_tl: "0.03nc"
        repeat_full_cp_while_improving: false
        log_full_cp_search_progress: true
  - name: mcf_lb_4_4cores_pf2
    timelimit: 300.0
    output_subdir: mcf_lb_4_4cores_pf2
    subroutine_flow:
      - method: run_mcf_lb_4
        last_stage_only_priority_tags:
          - "start_time"
        last_stage_only_cp_pf_method: "PF1"
        last_stage_only_cp_solver_thread_cnt: 4
        repeat_last_stage_only_cp_while_improving: true
        log_last_stage_only_cp_search_progress: true
        full_cp_pf_method: "PF1"
        full_cp_solver_thread_cnt: 4
        repeat_full_cp_while_improving: true
        log_full_cp_search_progress: true
