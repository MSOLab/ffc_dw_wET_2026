# wxd6/wxd7-only run: dispatch_sequence_full_sweep_config 와 동일 설정(large 전체,
#   0.09nc timelimit)으로 sd_wxd6 / sd_wxd7 / rd_wxd6 / rd_wxd7 만 실행한다.
#   기존 full sweep run(output/20260625/20260625T002044_922234)의 sd/rd_wxd2~4 와
#   wxd5-only run(output/20260625/20260625T014141_129123)의 sd/rd_wxd5 RPDf 와
#   동일 조건에서 비교하기 위함.
#   - partition: wxd5 와 동일(d̄₅ = max(중점평균, min_j r_j + Σ_j p_last/(m_last·2)))
#   - 정렬 center 분리: early = min r_j + Σ p_last / m_last (÷2 없음), late = min r_j
#   - wxd6: wxd2/5 곱셈형 키, wxd7: 쌩 weighted penalty 키
# See plans/experiment/20260625/wxd6_wxd7_dispatch.md
run_mode: FULL_RUN
benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv
output_dir: output/20260625
instance_worker_cnt: 96
draw_gantt: false
painter_thread_cnt: 96

scenarios:
  - name: sd_wxd6
    timelimit: "0.09nc"
    output_subdir: sd_wxd6
    subroutine_flow: [{ method: initialize_by_simple_dispatch, sequence: wxd6 }]
  - name: sd_wxd7
    timelimit: "0.09nc"
    output_subdir: sd_wxd7
    subroutine_flow: [{ method: initialize_by_simple_dispatch, sequence: wxd7 }]
  - name: rd_wxd6
    timelimit: "0.09nc"
    output_subdir: rd_wxd6
    subroutine_flow:
      [{ method: initialize_by_reversed_dispatch, sequence: wxd6 }]
  - name: rd_wxd7
    timelimit: "0.09nc"
    output_subdir: rd_wxd7
    subroutine_flow:
      [{ method: initialize_by_reversed_dispatch, sequence: wxd7 }]
