# coarsen_solve_reconstruct v3 seed comparison config.
#
# Compares seed_dispatch=mixed vs seed_dispatch=v3 on the same factors
# so the seed effect is isolated:
#   csrN_mixed  — seed_dispatch=mixed (best np-list candidate by wET).
#   csrN_v3     — seed_dispatch=v3 (v3 paired-dispatch pool on coarsened).
#
# See plans/experiment/20260625/coarsen_solve_reconstruct_v3_seed.md.

run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260625

instance_worker_cnt: 12

draw_gantt: false
painter_thread_cnt: 96

scenarios:
  - name: csr64_mixed
    timelimit: "0.09nc"
    output_subdir: csr64_mixed
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        seed_dispatch: mixed
        factor: 64
        timelimit: "0.0045nc"
        solver_thread_cnt: 8
        emit_phase_schedules: false
        draw_cp_trajectory: true

  - name: csr64_v3
    timelimit: "0.09nc"
    output_subdir: csr64_v3
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        seed_dispatch: v3
        factor: 64
        timelimit: "0.0045nc"
        solver_thread_cnt: 8
        emit_phase_schedules: false
        draw_cp_trajectory: true

