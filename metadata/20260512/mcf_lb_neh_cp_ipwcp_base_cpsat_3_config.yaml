# Pipeline: MCF-LB → NEH-CP → incremental PW-CP → base CPSAT
#
# Anchored on metadata/20260509/20260509_mcf_lb_best_neh_cp_best_base_cpsat.yaml.
# Adds an incremental_sw_cp refinement stage between NEH-CP and base CPSAT,
# spending ~1/5 of the scenario budget on PW-CP sliding-window sweeps.
#
# Two scenarios vary batch_size over the n/c/m vocabulary:
#   - batch_size: "m"  → 1 × last-stage machine count
#   - batch_size: "2m" → 2 × last-stage machine count
# Resolved to int (ceil) by the controller; PwCpOption receives the int.
#
# incremental_sw_cp timelimit semantics:
#   total_timelimit is per *inner* sw_cp invocation (split across that
#   sweep's batches). With increment_unfixed_batch_count_flag="always" and
#   unfixed_batch_count_min=2, max=8, sw_cp is invoked 7 times, so the
#   PW-CP stage spends up to 7 × 0.018nc = 0.126nc in CP — capped in
#   practice by the scenario-level 0.09nc wall-clock deadline.

run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
# ins_index: [0, 10, 20, 30, 40, 50, 60, 70, 80]
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260511

instance_worker_cnt: 12

draw_gantt: false
painter_thread_cnt: 16

scenarios:
  - name: mcf_lb_neh_cp_incremental_sw_cp_m_base_cpsat
    timelimit: "0.09nc"
    output_subdir: mcf_lb_neh_cp_incremental_sw_cp_m_base_cpsat
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.009nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.027nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 6
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        total_timelimit: "0.018nc"
        batch_tl_mode: "constant"
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8
