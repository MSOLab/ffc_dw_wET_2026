# CSR 초기화 방식 비교 실험 (plans/20260713/csr_init_methods.md)
#
# 초기화 방법만 비교. tail (incremental_sw_cp + solve_base_model_cpsat) 없음.
# CSR TL 전부 25% (0.0225nc) 통일.
#
# 예산 정책:
#   비-CSR baseline: 참조(metadata/20260710/sw_cp_tl_kappa_0.005.yaml)의 원본
#     init TL 그대로 — FMM 0.009nc, neh 0.027nc (불균등, 의도된 자연 비용).
#   CSR: 0.0225nc (= 0.09nc의 25%), inner TL은 원본의 1/4 (0.25배) 스케일.
#   공평 비교(equal-budget): mcf_lb_fmm_25p / neh_25p 는 CSR와 동일한 0.0225nc.
#
# CSR inner flow variants:
#   base:           default CP-SAT (no solve_flow)
#   full miniature: mcf→flip→neh→sw_cp→base_cp (CSR 제외)
#   neh-only:       neh→sw_cp→base_cp (mcf-lb/flip 제외)
#
# inner NEH job_priority 차원: weight-due-pos vs due2-weight-pos
# (full miniature, neh-only에만 적용 — base는 inner NEH 없음)
#
# Inner flow TL scaling within CSR budget (0.0225nc): 원본값 × 1/4
#   full miniature: flip 0.00225nc, neh 0.00675nc, kappa 0.00125
#   neh-only:       neh 0.00675nc, kappa 0.00125
#   (flip+neh가 CSR 예산을 다 쓰지 않음 — 남는 예산은 sw_cp/base_cp로)
scenarios:
  # ── Baseline 1: MCF LB only ──
  - name: mcf_lb
    timelimit: "0.09nc"
    output_subdir: mcf_lb
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true

  # ── Baseline 2: MCF LB + flip ──
  - name: mcf_lb_fmm
    timelimit: "0.09nc"
    output_subdir: mcf_lb_fmm
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.009nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false

  # ── Fair (equal-budget) 1: MCF LB + FMM @ CSR budget (0.0225nc) ──
  - name: mcf_lb_fmm_25p
    timelimit: "0.09nc"
    output_subdir: mcf_lb_fmm_25p
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.0225nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false

  # ── Baseline 3: NEH only ──
  - name: neh
    timelimit: "0.09nc"
    output_subdir: neh
    subroutine_flow:
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.027nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false

  # ── Fair (equal-budget) 2: NEH @ CSR budget (0.0225nc) ──
  - name: neh_25p
    timelimit: "0.09nc"
    output_subdir: neh_25p
    subroutine_flow:
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.0225nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false

  # ── CSR base: CSR (default CP-SAT, no solve_flow) + 25% TL ──
  - name: csr_base
    timelimit: "0.09nc"
    output_subdir: csr_base
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 4
        timelimit: "0.0225nc"
        idle_mode: "lookahead"

  # ── CSR full miniature (weight-due-pos): mcf→flip→neh→sw_cp→base_cp + 25% TL ──
  - name: csr_full_wdp
    timelimit: "0.09nc"
    output_subdir: csr_full_wdp
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 4
        timelimit: "0.0225nc"
        idle_mode: "lookahead"
        solve_flow:
          - method: calc_mcf_lb_and_derive_full_sch
            draw_pmtn_sch_heatmap: false
            job_placement_priority: "end_time"
            last_stage_only_placement_criteria: "dist"
            makespan_delta_ref: "lastStageOnlyMakespan"
            adjust_p: true
            adjust_r: true
            r_adjust_coeff: 0.5
            proceed_r2_when_nonpositive_cmax: true
          - method: run_flip_makespan_cp_from_incumbent
            cp_tl: "0.00225nc"
            solver_thread_cnt: 8
            log_search_progress: false
            emit_phase_schedules: false
          - method: neh_cp
            job_priority: "weight-due-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.00675nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.00125
            rj_right_justify_scope: "rtf_only"
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8

  # ── CSR full miniature (due2-weight-pos): mcf→flip→neh→sw_cp→base_cp + 25% TL ──
  - name: csr_full_d2wp
    timelimit: "0.09nc"
    output_subdir: csr_full_d2wp
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 4
        timelimit: "0.0225nc"
        idle_mode: "lookahead"
        solve_flow:
          - method: calc_mcf_lb_and_derive_full_sch
            draw_pmtn_sch_heatmap: false
            job_placement_priority: "end_time"
            last_stage_only_placement_criteria: "dist"
            makespan_delta_ref: "lastStageOnlyMakespan"
            adjust_p: true
            adjust_r: true
            r_adjust_coeff: 0.5
            proceed_r2_when_nonpositive_cmax: true
          - method: run_flip_makespan_cp_from_incumbent
            cp_tl: "0.00225nc"
            solver_thread_cnt: 8
            log_search_progress: false
            emit_phase_schedules: false
          - method: neh_cp
            job_priority: "due2-weight-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.00675nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.00125
            rj_right_justify_scope: "rtf_only"
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8

  # ── CSR neh-only (weight-due-pos): neh→sw_cp→base_cp + 25% TL ──
  - name: csr_neh_wdp
    timelimit: "0.09nc"
    output_subdir: csr_neh_wdp
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 4
        timelimit: "0.0225nc"
        idle_mode: "lookahead"
        solve_flow:
          - method: neh_cp
            job_priority: "weight-due-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.00675nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.00125
            rj_right_justify_scope: "rtf_only"
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8

  # ── CSR neh-only (due2-weight-pos): neh→sw_cp→base_cp + 25% TL ──
  - name: csr_neh_d2wp
    timelimit: "0.09nc"
    output_subdir: csr_neh_d2wp
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 4
        timelimit: "0.0225nc"
        idle_mode: "lookahead"
        solve_flow:
          - method: neh_cp
            job_priority: "due2-weight-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.00675nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.00125
            rj_right_justify_scope: "rtf_only"
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8
