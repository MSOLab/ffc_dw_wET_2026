# MCF-LB init -> flip-minimize-makespan figure setting.
#
# One scenario, one instance. The flip step emits its seven intermediate
# schedules; the two we render as SVG are:
#   * 01_incumbent       = the MCF-LB-derived full schedule (the seed)
#   * 07_unflipped_final = the flip-makespan-optimized schedule
#
# draw_gantt is off: the post-run reporter would render PNGs, but we want
# vector SVGs, so scripts/render_mcf_lb_fmm_svg.py renders both
# phase JSONs as .svg afterwards.
#
# NOTE: the final <ins>_solution.json holds the best-by-wET incumbent, which
# (because flip minimizes makespan, not wET) is usually the MCF-LB schedule,
# NOT the flip output. Hence we render from the flip phase JSONs, not from
# solution.json.

run_mode: FULL_RUN

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
ins_index: [0] # Instance_50_5_3_0,2_0,2_10_Rep0
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260611

instance_worker_cnt: 1

draw_gantt: false
painter_thread_cnt: 1

scenarios:
  - name: mcf_lb_fmm
    timelimit: 90
    output_subdir: mcf_lb_fmm
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: true # emit per-round signed C-cost heatmap YAML
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
        emit_phase_schedules: true # emit per-round MCF-LB intermediate schedules
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: 30
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: true
