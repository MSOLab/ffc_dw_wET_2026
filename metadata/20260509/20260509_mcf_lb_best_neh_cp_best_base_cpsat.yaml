# Pipeline: MCF-LB best → NEH-CP best → base CPSAT, with/without flip makespan CP.
#
# MCF-LB settings from 37-sweep best:
#   makespan_delta_ref: "lastStageOnlyMakespan"
#   adjust_p: true, adjust_r: true, r_adjust_coeff: 0.5
#   proceed_r2_when_nonpositive_cmax: true
#
# NEH-CP settings from prior best:
#   job_priority: "due2-weight-pos", batch_size: 15, pf_method: "PF1"
#
# Two scenarios:
#   1. mcf_lb_best_neh_cp_best_base_cpsat
#      MCF-LB → NEH-CP → base CPSAT
#   2. mcf_lb_best_neh_cp_best_flip_makespan_cp_base_cpsat
#      MCF-LB → NEH-CP → flip makespan CP → base CPSAT
#      Tests whether flip makespan CP improves the incumbent before CPSAT.

run_mode: FULL_RUN # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
# ins_index: [ 0, 10, 20, 30, 40, 50, 60, 70, 80 ]
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260509

instance_worker_cnt: 12

draw_gantt: false
painter_thread_cnt: 16

scenarios:
  - name: mcf_lb_best_neh_cp_best_base_cpsat
    timelimit: "0.09nc"
    output_subdir: mcf_lb_best_neh_cp_best_base_cpsat
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.027nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8
  - name: mcf_lb_best_neh_cp_best_flip_makespan_cp_base_cpsat
    timelimit: "0.09nc"
    output_subdir: mcf_lb_best_neh_cp_best_flip_makespan_cp_base_cpsat
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.027nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.009nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8
