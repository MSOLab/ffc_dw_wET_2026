# CSR seed-only A/B comparison config (small subset).
#
# Deterministic seed-quality comparison between branches:
#   - 20260624_more_init_dispatch_solvefalse  (old seed algorithm)
#   - 20260629_csr                            (new seed algorithm)
# Same config on both branches; solve=False makes output = reconstruct(seed),
# so the per-instance obj_value delta is purely the seed-algorithm difference.
# Distinguish the two runs by run timestamp / git hash (recorded per run).
#
# Subset: 8 instances across size families, factors [1, 4, 16, 64], all 4 seed
# strategies. factor=1 is the control (coarse-grid change is a K=1 no-op).

run_mode: FULL_RUN

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260630_csr_seed_only_ab

instance_worker_cnt: 8
draw_gantt: false

ins_index: [0, 270, 360, 630, 720, 990, 1080, 1350]

scenarios:
  - name: mixed_f1
    timelimit: "5nc"
    output_subdir: mixed_f1
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        seed_dispatch: mixed
        factor: 1
        solve: false

  - name: mixed_f4
    timelimit: "5nc"
    output_subdir: mixed_f4
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        seed_dispatch: mixed
        factor: 4
        solve: false

