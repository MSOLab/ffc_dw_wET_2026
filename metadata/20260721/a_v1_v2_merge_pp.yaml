# POST_PROCESS_ONLY head-to-head report: the a_c5_batch_m baseline as run in v1
# vs v2, differing only in the outer incremental_sw_cp step.
#
#   a_v1_const018_max6 <- output/20260721_csr_init_isw_batch/20260721T015603_278451/a_c5_batch_m
#       incremental_sw_cp: batch_tl_mode=constant, total_timelimit=0.018nc, max=6
#   a_v2_kappa005_max8 <- output/20260721_csr_init_isw_batch/20260721T140525_983136/a_c5_batch_m
#       incremental_sw_cp: batch_tl_mode=proportional, kappa(mult)=0.005, max=8
#
# Every other step (mcf_lb, flip, neh_cp, batch_size=m, base_cp) and the 0.09nc
# cap are identical, so the report isolates the outer-ISW-CP retuning on the
# baseline. analysis_dir_path is the synthetic merged run dir built by
# scripts/build_merged_run_dir.py (symlinks to the two source scenarios), so the
# reporter treats them as one run without touching either source.
#
# Each scenario's subroutine_flow is copied verbatim from its OWN source config
# (v1: metadata/20260721/csr_init_isw_batch.yaml, v2: ..._batch_2.yaml).
# draw_gantt/draw_progress_plot false: those painters would write through the
# symlinks into the source instance dirs.
run_mode: POST_PROCESS_ONLY
analysis_dir_path: output/20260721_a_v1_v2_merge/20260721T164958_319565

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260721_a_v1_v2_merge

instance_worker_cnt: 12
draw_gantt: false
draw_progress_plot: false
painter_thread_cnt: 8

scenarios:
  # ---- v1 baseline: constant TL 0.018nc, unfixed_batch_count_max=6 ----------
  - name: a_v1_const018_max6
    timelimit: "0.09nc"
    output_subdir: a_v1_const018_max6
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.009nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.027nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 6
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        total_timelimit: "0.018nc"
        batch_tl_mode: "constant"
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

  # ---- v2 baseline: proportional TL kappa=0.005, unfixed_batch_count_max=8 --
  - name: a_v2_kappa005_max8
    timelimit: "0.09nc"
    output_subdir: a_v2_kappa005_max8
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.009nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.027nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 8
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        batch_tl_mode: "proportional"
        non_time_fixed_op_time_limit_multiplier: 0.005
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8
