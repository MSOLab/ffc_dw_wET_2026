# POST_PROCESS_ONLY report for the a_c5_batch_m scenario ONLY of the
# interrupted v2 run output/20260721_csr_init_isw_batch/20260721T140525_983136.
#
# v2 (config metadata/20260721/csr_init_isw_batch_2.yaml) was stopped after only
# a_c5_batch_m finished (1440/1440); c/b20/b30 are partial or empty, so the run
# never emitted its run-level reports. This config regenerates them for the one
# complete arm: it points analysis_dir_path at the real run dir and declares
# only a_c5_batch_m, so the runner loads that scenario's on-disk instance
# results and writes <run>_rpdf_comparison.csv, the xlsx, and the dashboards
# without touching the incomplete scenarios.
#
# The a_c5_batch_m scenario block below is copied verbatim from
# metadata/20260721/csr_init_isw_batch_2.yaml. draw_gantt/draw_progress_plot are
# false so no painter reaches into instance dirs.
run_mode: POST_PROCESS_ONLY
analysis_dir_path: output/20260721_csr_init_isw_batch/20260721T140525_983136

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260721_csr_init_isw_batch

instance_worker_cnt: 12
draw_gantt: false
draw_progress_plot: false
painter_thread_cnt: 8

scenarios:
  - name: a_c5_batch_m
    timelimit: "0.09nc"
    output_subdir: a_c5_batch_m
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.009nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.027nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 8
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        batch_tl_mode: "proportional"
        non_time_fixed_op_time_limit_multiplier: 0.005
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8
