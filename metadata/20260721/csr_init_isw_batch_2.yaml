# CSR k=1 initializer + ISW-CP m+2 batch, with the OUTER ISW-CP retuned.
#
# Plan:  plans/experiment/20260721/csr_init_isw_cp_batch_size.md
# Rerun of: output/20260721_csr_init_isw_batch/20260721T015603_278451 (v1,
#   analysis plans/analysis/20260721/csr_init_isw_batch_result.md), where every
#   arm lost to A. Same 4-arm design; the one change is the outer ISW-CP.
#
# What changed vs v1: v1 kept the outer ISW-CP on C5's original time control
# (batch_tl_mode=constant, total_timelimit=0.018nc per inner sw_cp call,
# unfixed_batch_count_max=6). That was an oversight. Here the outer ISW-CP's
# parameters are taken from metadata/20260710/sw_cp_tl_kappa_0.005.yaml
# (scenario kappa_0.005): batch_tl_mode=proportional,
# non_time_fixed_op_time_limit_multiplier=0.005 (kappa), no total_timelimit,
# unfixed_batch_count_min=2 / max=8, lpf=rpf=2, promotion on, step_size=1,
# pf_method=PF1, flag=always. Applied identically to all four arms (batch_size
# kept per-arm: m for A, m+2 for C/B20/B30), so it does not confound any
# contrast below.
#
# 4 scenarios x full 1440-grid, outer budget 0.09nc fixed:
#
#   A    C5 as-is (mcf->flip->neh_cp->ISW-CP batch=m->base_cp)   baseline
#   C    A + ISW-CP batch = m+2                                  batch effect, isolated
#   B20  initializer -> CSR k=1 f=20% (0.018nc) + batch = m+2    proposal, cheap init
#   B30  initializer -> CSR k=1 f=30% (0.027nc) + batch = m+2    proposal, rich init
#
# Contrasts: C-A = batch widening alone. B20-C / B30-C = initializer swap at
# fixed batch width. B30-B20 = init-vs-post-init budget split. B20-A / B30-A =
# end-to-end headline.
#
# Provenance (copied, not transcribed):
#   step layout (which steps, in what order)
#     <- metadata/20260517/ablation_ladder_config.yaml : c5_isw_cp
#   outer ISW-CP parameters
#     <- metadata/20260710/sw_cp_tl_kappa_0.005.yaml : kappa_0.005
#   B20 / B30's coarsen_solve_reconstruct step (inner solve_flow included)
#     <- metadata/20260714/csr_tl_scaling_sweep.yaml : csr_full_d2wp_k1_tl20 /
#        csr_full_d2wp_k1_tl30 -- the blocks that produced plan §3's f=20%/30% figures
#
# k=1 is the identity under all three rounding modes (ceil(p/1)=round(p/1)=
# p//1=p), so no coarsening is in play -- unrelated to the 2026-07-20 k>1
# negative result (plan §2). The outer ISW-CP now runs to the global wall clock
# under proportional TL, so solve_base_model_cpsat only runs if ISW-CP converges
# early -- intended, usually opportunistic (plan §5).
#
# Judging: RPDf vs BKS_data (symmetric). ALWAYS stratify by T -- the ladder span
# differs 3.1x across slices, so a pooled mean hides the mechanism (plan §3).

run_mode: FULL_RUN

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260721_csr_init_isw_batch

instance_worker_cnt: 12
draw_gantt: false
draw_progress_plot: false
painter_thread_cnt: 1

scenarios:
  # ---- A: C5 as it stands today (baseline) ----------------------------
  - name: a_c5_batch_m
    timelimit: "0.09nc"
    output_subdir: a_c5_batch_m
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.009nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.027nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 8
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        batch_tl_mode: "proportional"
        non_time_fixed_op_time_limit_multiplier: 0.005
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

  # ---- C: A with ISW-CP batch widened to m+2 --------------------------
  - name: c_c5_batch_m_plus_2
    timelimit: "0.09nc"
    output_subdir: c_c5_batch_m_plus_2
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.009nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.027nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        extra_batch_size_expr: 2
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 8
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        batch_tl_mode: "proportional"
        non_time_fixed_op_time_limit_multiplier: 0.005
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

  # ---- B20: CSR κ=1 @ f=20% initializer, ISW-CP batch m+2 -------------
  - name: b20_csr_k1_f20_batch_m_plus_2
    timelimit: "0.09nc"
    output_subdir: b20_csr_k1_f20_batch_m_plus_2
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 1
        timelimit: "0.0180nc"
        idle_mode: "lookahead"
        solve_flow:
          - method: calc_mcf_lb_and_derive_full_sch
            draw_pmtn_sch_heatmap: false
            job_placement_priority: "end_time"
            last_stage_only_placement_criteria: "dist"
            makespan_delta_ref: "lastStageOnlyMakespan"
            adjust_p: true
            adjust_r: true
            r_adjust_coeff: 0.5
            proceed_r2_when_nonpositive_cmax: true
          - method: run_flip_makespan_cp_from_incumbent
            cp_tl: "0.00180nc"
            solver_thread_cnt: 8
            log_search_progress: false
            emit_phase_schedules: false
          - method: neh_cp
            job_priority: "due2-weight-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.00540nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.001
            rj_right_justify_scope: "rtf_only"
            idle_mode: "lookahead"
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        extra_batch_size_expr: 2
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 8
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        batch_tl_mode: "proportional"
        non_time_fixed_op_time_limit_multiplier: 0.005
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

  # ---- B30: CSR κ=1 @ f=30% initializer, ISW-CP batch m+2 -------------
  - name: b30_csr_k1_f30_batch_m_plus_2
    timelimit: "0.09nc"
    output_subdir: b30_csr_k1_f30_batch_m_plus_2
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 1
        timelimit: "0.0270nc"
        idle_mode: "lookahead"
        solve_flow:
          - method: calc_mcf_lb_and_derive_full_sch
            draw_pmtn_sch_heatmap: false
            job_placement_priority: "end_time"
            last_stage_only_placement_criteria: "dist"
            makespan_delta_ref: "lastStageOnlyMakespan"
            adjust_p: true
            adjust_r: true
            r_adjust_coeff: 0.5
            proceed_r2_when_nonpositive_cmax: true
          - method: run_flip_makespan_cp_from_incumbent
            cp_tl: "0.00270nc"
            solver_thread_cnt: 8
            log_search_progress: false
            emit_phase_schedules: false
          - method: neh_cp
            job_priority: "due2-weight-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.00810nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.0015
            rj_right_justify_scope: "rtf_only"
            idle_mode: "lookahead"
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        extra_batch_size_expr: 2
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 8
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        batch_tl_mode: "proportional"
        non_time_fixed_op_time_limit_multiplier: 0.005
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8
