# Replace the C5 initializer with CSR κ=1, then widen the ISW-CP batch.
#
# 계획: plans/experiment/20260721/csr_init_isw_cp_batch_size.md
#
# 4 scenario × full 1440-grid, outer budget 0.09nc 고정.
#
#   A    C5 그대로 (mcf→flip→neh_cp→ISW-CP batch=m→base_cp)     baseline
#   C    A + ISW-CP batch = m+2                                  batch 효과 단독
#   B20  초기화를 CSR κ=1 f=20%(0.018nc)로 교체 + batch = m+2     제안, cheap init
#   B30  초기화를 CSR κ=1 f=30%(0.027nc)로 교체 + batch = m+2     제안, rich init
#
# 대비: C−A = batch widening 단독. B20−C / B30−C = 고정 batch 폭에서의
# 초기화 교체. B30−B20 = init/tail 예산 배분. B20−A / B30−A = end-to-end.
#
# 출처(손으로 옮겨적지 않음):
#   A / C 의 4개 step + B* 의 outer ISW-CP·base_cp
#     ← metadata/20260517/ablation_ladder_config.yaml : c5_isw_cp
#   B20 / B30 의 coarsen_solve_reconstruct step(내부 solve_flow 포함)
#     ← metadata/20260714/csr_tl_scaling_sweep.yaml : csr_full_d2wp_k1_tl20 /
#       csr_full_d2wp_k1_tl30 — 계획 §3 이 인용한 f=20%/30% 수치를 낸 바로 그 블록
#
# κ=1 은 세 rounding mode 모두에서 항등(ceil(p/1)=round(p/1)=p//1=p)이라
# coarsening 이 개입하지 않는다 — 2026-07-20 의 κ>1 음성 결과와 무관(계획 §2).
# ISW-CP 는 전 arm 0.018nc 고정이라 batch 폭 변화가 예산 변화와 교락되지 않고,
# solve_base_model_cpsat 이 남은 예산을 흡수한다(계획 §5).
#
# 판정: BKS_data 대비 RPDf(대칭). **반드시 T 로 층화**해서 볼 것 — ladder span 이
# 슬라이스별로 3.1배 차이라 pooled mean 은 메커니즘을 가린다(계획 §3).

run_mode: FULL_RUN

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
ins_index: [60, 61]
# ins_index: [
#   60, 61, 62, 63, 64, 65, 66, 67, 68, 69,
#   150, 151, 152, 153, 154, 155, 156, 157, 158, 159,
#   240, 241, 242, 243, 244, 245, 246, 247, 248, 249,
#   330, 331, 332, 333, 334, 335, 336, 337, 338, 339,
#   420, 421, 422, 423, 424, 425, 426, 427, 428, 429,
#   510, 511, 512, 513, 514, 515, 516, 517, 518, 519,
#   600, 601, 602, 603, 604, 605, 606, 607, 608, 609,
#   690, 691, 692, 693, 694, 695, 696, 697, 698, 699,
#   780, 781, 782, 783, 784, 785, 786, 787, 788, 789,
#   870, 871, 872, 873, 874, 875, 876, 877, 878, 879,
#   960, 961, 962, 963, 964, 965, 966, 967, 968, 969,
#   1050, 1051, 1052, 1053, 1054, 1055, 1056, 1057, 1058, 1059,
#   1140, 1141, 1142, 1143, 1144, 1145, 1146, 1147, 1148, 1149,
#   1230, 1231, 1232, 1233, 1234, 1235, 1236, 1237, 1238, 1239,
#   1320, 1321, 1322, 1323, 1324, 1325, 1326, 1327, 1328, 1329,
#   1410, 1411, 1412, 1413, 1414, 1415, 1416, 1417, 1418, 1419,
# ]
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260721_csr_init_isw_batch

instance_worker_cnt: 12
draw_gantt: false
draw_progress_plot: false
painter_thread_cnt: 1

scenarios:
  # ---- A: C5 as it stands today (baseline) ----------------------------
  - name: a_c5_batch_m
    timelimit: "0.09nc"
    output_subdir: a_c5_batch_m
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.009nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.027nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 6
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        total_timelimit: "0.018nc"
        batch_tl_mode: "constant"
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

  # ---- C: A with ISW-CP batch widened to m+2 --------------------------
  - name: c_c5_batch_m_plus_2
    timelimit: "0.09nc"
    output_subdir: c_c5_batch_m_plus_2
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.009nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.027nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        extra_batch_size_expr: 2
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 6
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        total_timelimit: "0.018nc"
        batch_tl_mode: "constant"
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

  # ---- B20: CSR κ=1 @ f=20% initializer, ISW-CP batch m+2 -------------
  - name: b20_csr_k1_f20_batch_m_plus_2
    timelimit: "0.09nc"
    output_subdir: b20_csr_k1_f20_batch_m_plus_2
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 1
        timelimit: "0.0180nc"
        idle_mode: "lookahead"
        solve_flow:
          - method: calc_mcf_lb_and_derive_full_sch
            draw_pmtn_sch_heatmap: false
            job_placement_priority: "end_time"
            last_stage_only_placement_criteria: "dist"
            makespan_delta_ref: "lastStageOnlyMakespan"
            adjust_p: true
            adjust_r: true
            r_adjust_coeff: 0.5
            proceed_r2_when_nonpositive_cmax: true
          - method: run_flip_makespan_cp_from_incumbent
            cp_tl: "0.00180nc"
            solver_thread_cnt: 8
            log_search_progress: false
            emit_phase_schedules: false
          - method: neh_cp
            job_priority: "due2-weight-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.00540nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.001
            rj_right_justify_scope: "rtf_only"
            idle_mode: "lookahead"
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        extra_batch_size_expr: 2
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 6
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        total_timelimit: "0.018nc"
        batch_tl_mode: "constant"
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

  # ---- B30: CSR κ=1 @ f=30% initializer, ISW-CP batch m+2 -------------
  - name: b30_csr_k1_f30_batch_m_plus_2
    timelimit: "0.09nc"
    output_subdir: b30_csr_k1_f30_batch_m_plus_2
    subroutine_flow:
      - method: coarsen_solve_reconstruct
        factor: 1
        timelimit: "0.0270nc"
        idle_mode: "lookahead"
        solve_flow:
          - method: calc_mcf_lb_and_derive_full_sch
            draw_pmtn_sch_heatmap: false
            job_placement_priority: "end_time"
            last_stage_only_placement_criteria: "dist"
            makespan_delta_ref: "lastStageOnlyMakespan"
            adjust_p: true
            adjust_r: true
            r_adjust_coeff: 0.5
            proceed_r2_when_nonpositive_cmax: true
          - method: run_flip_makespan_cp_from_incumbent
            cp_tl: "0.00270nc"
            solver_thread_cnt: 8
            log_search_progress: false
            emit_phase_schedules: false
          - method: neh_cp
            job_priority: "due2-weight-pos"
            solver_thread_cnt: 8
            added_batch_size: 15
            total_timelimit: "0.00810nc"
            batch_tl_mode: "linear"
            apply_cumulative_tl: false
            pf_method: "PF1"
            skip_pf_below_obj: "makespan"
            make_semi_active_after_cp: true
            minimize_makespan_lex: false
          - method: incremental_sw_cp
            solver_thread_cnt: 8
            batch_size: "m"
            step_size: 1
            unfixed_batch_count_min: 2
            unfixed_batch_count_max: 8
            increment_unfixed_batch_count_flag: "always"
            left_profile_fixed_batch_count: 2
            right_profile_fixed_batch_count: 2
            enable_promotion_profile_fixed: true
            pf_method: "PF1"
            batch_tl_mode: "proportional"
            non_time_fixed_op_time_limit_multiplier: 0.0015
            rj_right_justify_scope: "rtf_only"
            idle_mode: "lookahead"
          - method: solve_base_model_cpsat
            solver_thread_cnt: 8
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        extra_batch_size_expr: 2
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 6
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        total_timelimit: "0.018nc"
        batch_tl_mode: "constant"
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8
