# POST_PROCESS_ONLY: initialization-budget curve (dv4_c5init_f10/f20/f40)
# against the 20260722 full-initialization scenarios.
#
# Merged run dir built by scripts/build_merged_run_dir.py from:
#   dv4_c5init_f10                <- 20260728_dispatch_v4_init_tl/20260728T202801_339672/dv4_c5init_f10
#   dv4_c5init_f20                <- 20260728_dispatch_v4_init_tl/20260728T202801_339672/dv4_c5init_f20
#   dv4_c5init_f40                <- 20260728_dispatch_v4_init_tl/20260728T202801_339672/dv4_c5init_f40
#   a_v2_kappa005_max8            <- 20260722_csr_b30_vs_a_v1_v2/20260722T090801_437425/a_v2_kappa005_max8
#   a_v1_const018_max6            <- .../a_v1_const018_max6
#   b30_csr_k1_f30_batch_m        <- .../b30_csr_k1_f30_batch_m
#   b30_csr_k1_f30_batch_m_plus_2 <- .../b30_csr_k1_f30_batch_m_plus_2
#
# Comparison: initialization budget 4% / 8% / 16% of a 0.09nc total (with a v4
# dispatch prefix) vs the 40% full C5 initialization. Plan:
#   plans/experiment/20260728/dispatch_v4_init_tl_budget.md
#
# The 20260722 flows below are copied from metadata/20260722/csr_b30_vs_a_v1_v2_pp.yaml
# with every `idle_mode: "lookahead"` key removed — the kwarg was deleted in
# b971761 and main._reject_deprecated_step_kwargs now rejects it. Value is
# unchanged (lookahead was the only behavior).
run_mode: POST_PROCESS_ONLY
analysis_dir_path: output/20260728_init_budget_merge/20260729T041116_435991

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

output_dir: output/20260728_init_budget_merge

instance_worker_cnt: 12
draw_gantt: false            # required — true would follow symlinks into the source runs
draw_progress_plot: false    # required — same reason
painter_thread_cnt: 8

scenarios:
  # ---- init budget 10% of C5 (= 4% of the 0.09nc total), v4 dispatch prefix ----
  - name: dv4_c5init_f10
    timelimit: "0.09nc"
    output_subdir: dv4_c5init_f10
    subroutine_flow:
      - method: initialize_by_dispatch_v4
        reconstruct_mode: "active_but_last_semi"
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: "end_time"
        last_stage_only_placement_criteria: "dist"
        makespan_delta_ref: "lastStageOnlyMakespan"
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: "0.0009nc"
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: "due2-weight-pos"
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: "0.0027nc"
        batch_tl_mode: "linear"
        apply_cumulative_tl: false
        pf_method: "PF1"
        skip_pf_below_obj: "makespan"
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: incremental_sw_cp
        solver_thread_cnt: 8
        batch_size: "m"
        step_size: 1
        unfixed_batch_count_min: 2
        unfixed_batch_count_max: 8
        increment_unfixed_batch_count_flag: "always"
        left_profile_fixed_batch_count: 2
        right_profile_fixed_batch_count: 2
        enable_promotion_profile_fixed: true
        pf_method: "PF1"
        batch_tl_mode: "proportional"
        non_time_fixed_op_time_limit_multiplier: 0.005
      - method: solve_base_model_cpsat
        solver_thread_cnt: 8

