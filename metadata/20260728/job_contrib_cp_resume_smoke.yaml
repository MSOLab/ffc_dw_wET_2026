# job_contrib_cp smoke run — RESUME from 20260726 c5_init_only incumbents.
#
# Purpose: verify the newly added `job_contrib_cp` step end-to-end on real
# instances (destroy top-contributing jobs -> profile-fix the rest -> CP-SAT
# re-inserts), with before/after Gantts.
#
# The prefix below (calc_mcf_lb_and_derive_full_sch -> flip -> neh_cp) is copied
# VERBATIM from the base run's `subroutine_flow.yaml`. routix validates it by
# strict equality and derives flow_resume_idx=3, so only `job_contrib_cp` runs;
# the incumbent + LB are restored from the base's per-instance solution.json.
# Do not "tidy" the prefix — any edit breaks the prefix match.
#
# Run:
#   uv run python main.py metadata/20260728/job_contrib_cp_resume_smoke.yaml
#
# Plan: plans/experiment/20260728/critical_ns_port_from_hfs.md

run_mode: RESUME

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

# Base scenario dir (must contain subroutine_flow.yaml + per-instance
# solution.json). Full path form; `latest:<scenario>` only searches output_dir.
resume_dir: output/20260726_csr_init_tl_curve/20260726T231158_246105/c5_init_only

output_dir: output/20260728_job_contrib_cp_smoke

# 8-instance stratified slice of the 1440 grid (all present in the base run).
# Spans n {50,100,200} x c {5,10} x mps {3,5} x T {0.2,0.4,0.6} x R {0.2,0.6,1.0}
# x W {10,20}. T/R matter most here: they drive how many jobs carry a positive
# f_j(C_j), which is the hard cap on jd_count_eff.
#   0    Instance_50_5_3_0,2_0,2_10_Rep0     n=50  c=5  mps=3 T=.2 R=.2 W=10
#   80   Instance_50_5_3_0,6_1_10_Rep0       n=50  c=5  mps=3 T=.6 R=1. W=10
#   245  Instance_50_10_3_0,6_0,2_20_Rep0    n=50  c=10 mps=3 T=.6 R=.2 W=20
#   470  Instance_100_5_5_0,2_1_10_Rep0      n=100 c=5  mps=5 T=.2 R=1. W=10
#   585  Instance_100_10_3_0,4_0,6_20_Rep0   n=100 c=10 mps=3 T=.4 R=.6 W=20
#   690  Instance_100_10_5_0,6_0,2_10_Rep0   n=100 c=10 mps=5 T=.6 R=.2 W=10
#   1145 Instance_200_5_3_0,6_0,2_20_Rep0    n=200 c=5  mps=3 T=.6 R=.2 W=20
#   1370 Instance_200_10_5_0,2_1_10_Rep0     n=200 c=10 mps=5 T=.2 R=1. W=10
ins_index: [0, 80, 245, 470, 585, 690, 1145, 1370]

instance_worker_cnt: 8
draw_gantt: true
draw_progress_plot: true
painter_thread_cnt: 16

# timelimit stays 0.09nc (the base's budget) so the restored timer leaves the
# real remainder (~0.054nc) for the new step. cp_tl 0.018nc keeps one solve well
# inside that; the controller's wall-clock deadline clamps it further if the
# base overran.
#
# The 3-step prefix is repeated verbatim in every scenario. YAML sequences have
# no merge key, so an anchor would nest a list instead of splicing it — routix
# compares the prefix by strict equality, so it must be written out.
#
# log_search_progress: true is deliberate — it is what makes the dispatcher
# self-check the complete-hint invariant and warn if CP-SAT reports an
# incomplete hint. It does not spam stdout (log_to_stdout is forced off).
#
# error_if_infeasible: true is also deliberate for a verification run: with a
# complete feasible hint, INFEASIBLE/UNKNOWN is a bug signal and should be loud
# rather than silently falling back to the incumbent. Flip to false for
# production sweeps. (Budget exhaustion still falls back gracefully either way.)
scenarios:
  - name: jd1_pf1
    timelimit: 0.09nc
    output_subdir: jd1_pf1
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: end_time
        last_stage_only_placement_criteria: dist
        makespan_delta_ref: lastStageOnlyMakespan
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: 0.009nc
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: due2-weight-pos
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: 0.027nc
        batch_tl_mode: linear
        apply_cumulative_tl: false
        pf_method: PF1
        skip_pf_below_obj: makespan
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: job_contrib_cp
        jd_target: 1
        pf_method: PF1
        cp_tl: 0.018nc
        solver_thread_cnt: 8
        horizon_multiplier: 1.25
        error_if_infeasible: true
        log_search_progress: true
        draw_gantt: true

  - name: jd05n_pf1
    timelimit: 0.09nc
    output_subdir: jd05n_pf1
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: end_time
        last_stage_only_placement_criteria: dist
        makespan_delta_ref: lastStageOnlyMakespan
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: 0.009nc
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: due2-weight-pos
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: 0.027nc
        batch_tl_mode: linear
        apply_cumulative_tl: false
        pf_method: PF1
        skip_pf_below_obj: makespan
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: job_contrib_cp
        jd_target: 0.05n
        pf_method: PF1
        cp_tl: 0.018nc
        solver_thread_cnt: 8
        horizon_multiplier: 1.25
        error_if_infeasible: true
        log_search_progress: true
        draw_gantt: true

  - name: jd05n_pf0
    timelimit: 0.09nc
    output_subdir: jd05n_pf0
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: end_time
        last_stage_only_placement_criteria: dist
        makespan_delta_ref: lastStageOnlyMakespan
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: 0.009nc
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: due2-weight-pos
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: 0.027nc
        batch_tl_mode: linear
        apply_cumulative_tl: false
        pf_method: PF1
        skip_pf_below_obj: makespan
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: job_contrib_cp
        jd_target: 0.05n
        pf_method: PF0
        cp_tl: 0.018nc
        solver_thread_cnt: 8
        horizon_multiplier: 1.25
        error_if_infeasible: true
        log_search_progress: true
        draw_gantt: true
