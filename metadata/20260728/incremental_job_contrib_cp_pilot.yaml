# incremental_job_contrib_cp pilot — RESUME from 20260726 c5_init_only incumbents.
#
# Purpose: pilot the newly added `incremental_job_contrib_cp` composite step on
# 5 selected instances (ins 60–64), verifying the ramp loop, TL policy, and
# summary log end-to-end before scaling to the full 1440 grid.
#
# Run:
#   uv run python main.py metadata/20260728/incremental_job_contrib_cp_pilot.yaml
#
# Plan: plans/experiment/20260728/incremental_job_contrib_cp.md

run_mode: RESUME

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
bks_table_csv_path: benchmarks/PRA2017/pra2017_bks_table.csv

resume_dir: output/20260726_csr_init_tl_curve/20260726T231158_246105/c5_init_only

output_dir: output/20260728_incremental_job_contrib_cp_pilot

# 5-instance verification slice (user-specified).
ins_index: [60, 61, 62, 63, 64]

instance_worker_cnt: 8
draw_gantt: false
draw_progress_plot: true
painter_thread_cnt: 16

# Total budget 0.09nc. The proportional TL policy (§5) auto-scales per-destroy
# CP time so the ramp stays inside the budget; wall-clock deadline clamping
# guarantees the composite never exceeds it.
#
# The 3-step prefix is repeated verbatim for resume matching. Only
# `incremental_job_contrib_cp` runs (flow_resume_idx=3).
scenarios:
  - name: ijd01n_k5
    timelimit: 0.09nc
    output_subdir: ijd01n_k5
    subroutine_flow:
      - method: calc_mcf_lb_and_derive_full_sch
        draw_pmtn_sch_heatmap: false
        job_placement_priority: end_time
        last_stage_only_placement_criteria: dist
        makespan_delta_ref: lastStageOnlyMakespan
        adjust_p: true
        adjust_r: true
        r_adjust_coeff: 0.5
        proceed_r2_when_nonpositive_cmax: true
      - method: run_flip_makespan_cp_from_incumbent
        cp_tl: 0.009nc
        solver_thread_cnt: 8
        log_search_progress: false
        emit_phase_schedules: false
      - method: neh_cp
        job_priority: due2-weight-pos
        solver_thread_cnt: 8
        added_batch_size: 15
        total_timelimit: 0.027nc
        batch_tl_mode: linear
        apply_cumulative_tl: false
        pf_method: PF1
        skip_pf_below_obj: makespan
        make_semi_active_after_cp: true
        minimize_makespan_lex: false
      - method: incremental_job_contrib_cp
        jd_start: 3
        jd_end: "0.1n"
        destroyed_op_tl_multiplier: 0.05
        pf_method: PF1
        solver_thread_cnt: 8
        error_if_infeasible: true
        log_search_progress: true
        draw_gantt: true
