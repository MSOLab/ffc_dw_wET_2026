# LB-init experiment config: sort jobs by MCF start time, then dispatch.
# Ref: plans/20260419/mcf_lb_init_dispatch.md

run_mode: FULL_RUN        # FULL_RUN | RESUME | POST_PROCESS_ONLY

benchmark_dir: benchmarks/PRA2017/large
ins_index_source: benchmarks/PRA2017/pra2017_hybrid_match.csv
# ins_index: [0, 1, 1439]

output_dir: output

# Parallel workers for throughput-oriented experimentation.
instance_worker_cnt: 48

# Gantt chart rendering. Post-run only; set false to skip entirely.
draw_gantt: false
painter_thread_cnt: 48

scenarios:
  - name: mcf_lb_init_avg_time
    timelimit: 300.0
    output_subdir: mcf_lb_init_avg_time
    subroutine_flow:
      - method: run_mcf_lb_4
        last_stage_only_priority_tags: ["avg_time"]
        last_stage_only_pf_method: "PF1"
        full_pf_method: "PF1"
  - name: mcf_lb_init_start_time
    timelimit: 300.0
    output_subdir: mcf_lb_init_start_time
    subroutine_flow:
      - method: run_mcf_lb_4
        last_stage_only_priority_tags: ["start_time"]
        last_stage_only_pf_method: "PF1"
        full_pf_method: "PF1"
  - name: mcf_lb_init_completion_time
    timelimit: 300.0
    output_subdir: mcf_lb_init_completion_time
    subroutine_flow:
      - method: run_mcf_lb_4
        last_stage_only_priority_tags: ["completion_time"]
        last_stage_only_pf_method: "PF1"
        full_pf_method: "PF1"
  - name: mcf_lb_init_due_date_ub
    timelimit: 300.0
    output_subdir: mcf_lb_init_due_date_ub
    subroutine_flow:
      - method: run_mcf_lb_4
        last_stage_only_priority_tags: ["due_date_ub"]
        last_stage_only_pf_method: "PF1"
        full_pf_method: "PF1"
  - name: mcf_lb_init_due_date_star
    timelimit: 300.0
    output_subdir: mcf_lb_init_due_date_star
    subroutine_flow:
      - method: run_mcf_lb_4
        last_stage_only_priority_tags: ["due_date_star"]
        last_stage_only_pf_method: "PF1"
        full_pf_method: "PF1"
  - name: mcf_lb_init_due_date_star_minus_half_p
    timelimit: 300.0
    output_subdir: mcf_lb_init_due_date_star_minus_half_p
    subroutine_flow:
      - method: run_mcf_lb_4
        last_stage_only_priority_tags: ["due_date_star_minus_half_p"]
        last_stage_only_pf_method: "PF1"
        full_pf_method: "PF1"
  - name: mcf_lb_init_all
    timelimit: 300.0
    output_subdir: mcf_lb_init_all
    subroutine_flow:
      - method: run_mcf_lb_4
        last_stage_only_priority_tags:
          - avg_time
          - start_time
          - completion_time
          - due_date_ub
          - due_date_star
          - due_date_star_minus_half_p
        last_stage_only_pf_method: "PF1"
        full_pf_method: "PF1"