[project]
name = "ffc-ddw-sum-et"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.1",
    "routix>=0.0.16",
    "matplotlib>=3.10.0",
    "xlsxwriter>=3.2.0",
    "pyyaml>=6.0.3",
    "ortools>=9.15.6755",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python = ".venv/bin/python"
