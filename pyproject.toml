[project]
name = "ffc-ddw-sum-et"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.1",
    "matplotlib>=3.10.0",
    "xlsxwriter>=3.2.0",
    "pyyaml>=6.0.3",
    "ortools>=9.15.6755",
    "plotly>=6.7.0",
    "statsmodels>=0.14.6",
    "seaborn>=0.13.2",
    "routix>=0.0.17",
    "kaleido>=1.3.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Keep ruff's default rules (E4, E7, E9, F) and add isort import sorting.
extend-select = ["I"]

[tool.ty.environment]
python = ".venv"
